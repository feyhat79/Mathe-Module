                                                </div>

                                                <!-- Aktionen: Löschen -->
                                                <div class="studio-popover-field">
                                                    <button type="button" 
                                                            class="studio-btn-danger-subtle studio-btn-full" 
                                                            @click="removeActiveSector()" 
                                                            title="Diesen Sektor entfernen">
                                                        🗑️ Sektor entfernen
                                                    </button>
                                                </div>

                                                <!-- Navigation -->
                                                <div class="studio-popover-nav-row">
                                                    <button type="button" class="btn-popover-nav" @click="selectPrevSector()" title="Vorheriger Sektor">◀ Zurück</button>
                                                    <span class="popover-hint">Sektor wechseln</span>
                                                    <button type="button" class="btn-popover-nav" @click="selectNextSector()" title="Nächster Sektor">Weiter ▶</button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ── Statistik & Diagramme WYSIWYG Editor ── -->
                    <template x-if="workingModule && workingModule.type === 'diagramm'">
                        <div class="studio-wysiwyg-layout">
                            <!-- Top Toolbar -->
                            <div class="studio-top-toolbar">
                                <!-- Typ-Auswahl Pills -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Typ:</span>
                                    <div class="segmented-control">
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'saeule' }" 
                                                @click="setDiagType('saeule')"
                                                title="Vertikales Säulendiagramm">📊 Säule</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'balken' }" 
                                                @click="setDiagType('balken')"
                                                title="Horizontales Balkendiagramm">📋 Balken</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'stab' }" 
                                                @click="setDiagType('stab')"
                                                title="Stabdiagramm / Nadeldiagramm">📍 Stab</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'linie' }" 
                                                @click="setDiagType('linie')"
                                                title="Liniendiagramm / Verlauf">📈 Linie</button>
                                    </div>
                                </div>

                                <!-- Modus Pills -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Modus:</span>
                                    <div class="segmented-control">
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.mode === 'show' }" 
                                                @click="setDiagMode('show')"
                                                title="Diagramm fertig anzeigen">👁️ Anzeigen</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.mode === 'draw' }" 
                                                @click="setDiagMode('draw')"
                                                title="Achsen & Gitter für Schüler zum Selberzeichnen (Lösungsschablone)">✏️ Einzeichnen</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.mode === 'read' }" 
                                                @click="setDiagMode('read')"
                                                title="Diagramm mit Ausfüllkästchen zum Ablesen">🔢 Ablesen</button>
                                    </div>
                                </div>

                                <!-- Presets Dropdown -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Vorlagen:</span>
                                    <select class="compact-select studio-preset-select" 
                                            @change="applyDiagrammStudioPreset($event.target.value); $event.target.value = ''">
                                        <option value="" disabled selected>✨ Vorlage wählen...</option>
                                        <option value="notenspiegel">📝 Notenspiegel (1–6)</option>
                                        <option value="wuerfel">🎲 Würfelwurf (1–6)</option>
                                        <option value="wochentage">📅 Wochentage (Mo–Fr)</option>
                                        <option value="haustiere">🐶 Haustiere (5 Kategorien)</option>
                                        <option value="quartale">📊 Quartale (Q1–Q4)</option>
                                        <option value="clear">🗑️ Alles leeren</option>
                                    </select>
                                </div>

                                <!-- Achsen & Gitter -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Skala:</span>
                                    <div class="studio-input-with-label">
                                        <span class="studio-mini-label">Max:</span>
                                        <input type="number" 
                                               class="compact-input studio-num-input" 
                                               x-model.number="workingModule.data.yMax" 
                                               step="1" 
                                               min="1"
                                               @input="touchRender()" 
                                               title="Maximalwert der Skala">
                                    </div>
                                    <div class="studio-input-with-label">
                                        <span class="studio-mini-label">Schritt:</span>
                                        <input type="number" 
                                               class="compact-input studio-num-input" 
                                               x-model.number="workingModule.data.yStep" 
                                               step="0.5" 
                                               min="0.1"
                                               @input="touchRender()" 
                                               title="Schrittweite der Achsenskalierung">
                                    </div>
                                    <button type="button"
                                            class="btn-secondary btn-small studio-subtle-btn"
                                            :class="{ 'active': workingModule.data.showGrid !== false }"
                                            @click="toggleDiagGrid()"
                                            title="Gitternetzlinien umschalten">
                                        <span x-text="workingModule.data.showGrid !== false ? '▦ Gitter an' : '▢ Gitter aus'"></span>
                                    </button>
                                </div>

                                <!-- Füllung -->
                                <div class="studio-toolbar-group" x-show="workingModule.data.type === 'saeule' || workingModule.data.type === 'balken'">
                                    <span class="studio-group-label">Muster:</span>
                                    <div class="studio-diag-fill-swatches">
                                        <button type="button" 
                                                class="studio-diag-fill-btn fill-grey"
                                                :class="{ 'active': (workingModule.data.fillType || 'grey') === 'grey' }"
                                                @click="setDiagFillType('grey')"
                                                title="Grau"></button>
                                        <button type="button" 
                                                class="studio-diag-fill-btn fill-striped"
                                                :class="{ 'active': workingModule.data.fillType === 'striped' }"
                                                @click="setDiagFillType('striped')"
                                                title="Schraffiert"></button>
                                        <button type="button" 
                                                class="studio-diag-fill-btn fill-black"
                                                :class="{ 'active': workingModule.data.fillType === 'black' }"
                                                @click="setDiagFillType('black')"
                                                title="Schwarz"></button>
                                        <button type="button" 
                                                class="studio-diag-fill-btn fill-accent"
                                                :class="{ 'active': workingModule.data.fillType === 'primary' }"
                                                @click="setDiagFillType('primary')"
                                                title="Akzentfarbe"></button>
                                    </div>
                                </div>

                                <!-- Blatt-Größe -->
                                <div class="studio-toolbar-group studio-toolbar-actions">
                                    <span class="studio-group-label">Druckgröße:</span>
                                    <div class="studio-input-with-label">
                                        <span class="studio-mini-label">B:</span>
                                        <input type="number" 
                                               class="compact-input studio-num-input" 
                                               x-model.number="workingModule.data.width" 
                                               step="0.5" 
                                               min="4" 
                                               max="18"
                                               @input="touchRender()" 
                                               title="Breite in cm auf A4">
                                        <span class="studio-unit">cm</span>
                                    </div>
                                    <div class="studio-input-with-label">
                                        <span class="studio-mini-label">H:</span>
                                        <input type="number" 
                                               class="compact-input studio-num-input" 
                                               x-model.number="workingModule.data.height" 
                                               step="0.5" 
                                               min="3" 
                                               max="15"
                                               @input="touchRender()" 
                                               title="Höhe in cm auf A4">
                                        <span class="studio-unit">cm</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Beschriftungs-Leiste -->
                            <div class="studio-secondary-toolbar">
                                <div class="studio-input-row-flex">
                                    <div class="studio-field-compact">
                                        <label class="studio-field-label">Titel:</label>
                                        <input type="text" 
                                               class="compact-input studio-title-input" 
                                               x-model="workingModule.data.title" 
                                               placeholder="z. B. Klassenumfrage..." 
                                               @input="touchRender()">
                                    </div>
                                    <div class="studio-field-compact">
                                        <label class="studio-field-label">X-Achse:</label>
                                        <input type="text" 
                                               class="compact-input studio-axis-input" 
                                               x-model="workingModule.data.xAxisLabel" 
                                               placeholder="z. B. Note / Farbe" 
                                               @input="touchRender()">
                                    </div>
                                    <div class="studio-field-compact">
                                        <label class="studio-field-label">Y-Achse:</label>
                                        <input type="text" 
                                               class="compact-input studio-axis-input" 
                                               x-model="workingModule.data.yAxisLabel" 
                                               placeholder="z. B. Anzahl / Häufigkeit" 
                                               @input="touchRender()">
                                    </div>
                                    <button type="button" 
                                            class="btn-primary btn-small studio-action-pill-btn"
                                            @click="addDiagItem()"
                                            title="Neue Kategorie hinzufügen">
                                        ➕ Kategorie
                                    </button>
                                </div>
                            </div>

                            <!-- Haupt-Arbeitsfläche mit Live-SVG & Popover -->
                            <div class="studio-wysiwyg-canvas-area studio-diag-canvas-area" @click="handleDiagCanvasClick($event)">
                                <div class="studio-wysiwyg-container studio-diag-container">
                                    
                                    <!-- Status-Badge -->
                                    <div class="studio-canvas-dimension-badge">
                                        <span>Status: </span>
                                        <strong x-text="getDiagrammStudioStatusText()"></strong>
                                    </div>

                                    <!-- Interaktive SVG-Vorschau -->
                                    <div class="studio-diag-svg-wrapper" x-html="getDiagrammPreviewSvg()"></div>

                                    <!-- In-Place Popover für die ausgewählte Kategorie/Säule -->
                                    <div id="studio-diag-popover" 
                                         class="studio-canvas-popover studio-diag-popover" 
                                         x-show="activeDiagItemIdx !== null && getActiveDiagItem()" 
                                         @click.stop>
                                        
                                        <template x-if="getActiveDiagItem()">
                                            <div class="studio-popover-card">
                                                <!-- Popover Header -->
                                                <div class="studio-popover-header">
                                                    <span class="studio-popover-title">
                                                        Kategorie <strong x-text="(activeDiagItemIdx + 1)"></strong>
                                                    </span>
                                                    <div class="studio-popover-actions">
                                                        <button type="button" 
                                                                class="studio-nav-btn" 
                                                                @click="selectPrevDiagItem()" 
                                                                title="Vorherige Kategorie">◀</button>
                                                        <button type="button" 
                                                                class="studio-nav-btn" 
                                                                @click="selectNextDiagItem()" 
                                                                title="Nächste Kategorie">▶</button>
                                                        <button type="button" 
                                                                class="studio-popover-close-btn" 
                                                                @click="closeDiagPopover()" 
                                                                title="Schließen">&times;</button>
                                                    </div>
                                                </div>

                                                <!-- Popover Content -->
                                                <div class="studio-popover-body">
                                                    <!-- Label input -->
                                                    <div class="studio-popover-field">
                                                        <label class="studio-field-label">Bezeichnung:</label>
                                                        <input type="text" 
                                                               class="compact-input studio-fullwidth-input" 
                                                               x-model="getActiveDiagItem().label" 
                                                               placeholder="Label..."
                                                               @input="touchRender()">
                                                    </div>

                                                    <!-- Value stepper -->
                                                    <div class="studio-popover-field">
                                                        <label class="studio-field-label">Wert (Höhe):</label>
                                                        <div class="studio-stepper-row">
                                                            <button type="button" 
                                                                    class="btn-secondary studio-stepper-btn"
                                                                    @click="getActiveDiagItem().value = Math.max(0, (parseFloat(getActiveDiagItem().value) || 0) - (workingModule.data.yStep || 1)); touchRender()">-</button>
                                                            <input type="number" 
                                                                   class="compact-input studio-stepper-input" 
                                                                   x-model.number="getActiveDiagItem().value" 
                                                                   min="0"
                                                                   :max="workingModule.data.yMax"
                                                                   @input="touchRender()">
                                                            <button type="button" 
                                                                    class="btn-secondary studio-stepper-btn"
                                                                    @click="getActiveDiagItem().value = Math.min(workingModule.data.yMax, (parseFloat(getActiveDiagItem().value) || 0) + (workingModule.data.yStep || 1)); touchRender()">+</button>
                                                        </div>
                                                    </div>

                                                    <!-- Delete button -->
                                                    <div class="studio-popover-footer-row">
                                                        <button type="button" 
                                                                class="btn-danger btn-small studio-danger-text-btn"
                                                                @click="removeActiveDiagItem()"
                                                                title="Diese Kategorie löschen">
                                                            🗑️ Löschen
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Datentabelle unter dem Diagramm für schnelle Tabellen-Übersicht -->
                                <div class="studio-diag-data-table-container">
                                    <div class="studio-table-header-row">
                                        <span class="studio-group-label">Kategorien & Werte:</span>
                                        <button type="button" 
                                                class="btn-secondary btn-small studio-action-pill-btn"
                                                @click="addDiagItem()">
                                            ➕ Kategorie hinzufügen
                                        </button>
                                    </div>
                                    <div class="studio-diag-chips-wrap">
                                        <template x-for="(item, idx) in (workingModule.data.items || [])" :key="idx">
                                            <div class="studio-diag-chip" 
                                                 :class="{ 'active': activeDiagItemIdx === idx }"
                                                 @click="selectDiagItem(idx, $event)">
                                                <span class="chip-label" x-text="item.label || ('Kategorie ' + (idx + 1))"></span>
                                                <span class="chip-badge" x-text="item.value"></span>
                                                <button type="button" 
                                                        class="chip-delete-btn" 
                                                        @click.stop="removeDiagItemByIdx(idx)"
                                                        title="Löschen">&times;</button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ── Wahrscheinlichkeitsverteilungen WYSIWYG Editor ── -->
                    <template x-if="workingModule && workingModule.type === 'verteilung'">
                        <div class="studio-wysiwyg-layout">
                            <!-- Top Toolbar -->
                            <div class="studio-top-toolbar">
                                <!-- Typ-Auswahl Pills -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Verteilung:</span>
                                    <div class="segmented-control">
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'binomial' }" 
                                                @click="setVerteilungType('binomial')"
                                                title="Binomialverteilung B(n, p) - diskret mit Säulen">📊 Binomial B(n, p)</button>
                                        <button type="button" 
                                                :class="{ 'active': workingModule.data.type === 'normal' }" 
                                                @click="setVerteilungType('normal')"
                                                title="Normalverteilung N(μ, σ) - stetige Gauß-Glockenkurve">📈 Normal N(μ, σ)</button>
                                    </div>
                                </div>

                                <!-- Didaktische Vorlagen -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Vorlagen:</span>
                                    <select class="studio-select" @change="applyVerteilungStudioPreset($event.target.value); $event.target.value = ''">
                                        <option value="" disabled selected>Beispiel wählen...</option>
                                        <optgroup label="Binomialverteilung (Bernoulli)">
                                            <option value="coin">🪙 Münzwurf (n=10, p=0.5)</option>
                                            <option value="dice">🎲 Würfel '6' (n=30, p=0.17)</option>
                                            <option value="mc">📝 Multiple Choice (n=20, p=0.25)</option>
                                            <option value="defect">⚙️ Qualitätsprüfung (n=50, p=0.04)</option>
                                            <option value="poll">🗳️ Wahlumfrage (n=100, p=0.40)</option>
                                        </optgroup>
                                        <optgroup label="Normalverteilung (Gauß)">
                                            <option value="norm_std">📐 Standardnormal (μ=0, σ=1)</option>
                                            <option value="norm_iq">🧠 Intelligenztest (μ=100, σ=15)</option>
                                            <option value="norm_height">📏 Körpergröße (μ=175, σ=7)</option>
                                            <option value="norm_fill">📦 Abfüllmenge (μ=500, σ=10)</option>
                                        </optgroup>
                                    </select>
                                </div>

                                <!-- Druckmaße -->
                                <div class="studio-toolbar-group">
                                    <span class="studio-group-label">Druckgröße:</span>
                                    <div class="studio-inline-inputs">
                                        <label class="studio-dim-label">B:</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               x-model.number="workingModule.data.settings.width" 
                                               @input="touchRender()" 
                                               step="0.5" 
                                               min="4" 
                                               max="25"
                                               title="Breite in cm">
                                        <span class="studio-dim-unit">×</span>
                                        <label class="studio-dim-label">H:</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               x-model.number="workingModule.data.settings.height" 
                                               @input="touchRender()" 
                                               step="0.5" 
                                               min="3" 
                                               max="25"
                                               title="Höhe in cm">
                                        <span class="studio-dim-unit">cm</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Secondary Toolbar: Parameter & Intervall -->
                            <div class="studio-secondary-toolbar">
                                <!-- Parameter für Binomialverteilung -->
                                <template x-if="workingModule.data.type === 'binomial'">
                                    <div class="studio-toolbar-group">
                                        <span class="studio-group-label">Parameter:</span>
                                        <label class="studio-dim-label">n =</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               :value="workingModule.data.n" 
                                               @input="setVerteilungN($event.target.value)" 
                                               step="1" 
                                               min="1" 
                                               max="250"
                                               title="Anzahl der Versuche (n)">
                                        <label class="studio-dim-label margin-left-xs">p =</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               :value="workingModule.data.p" 
                                               @input="setVerteilungP($event.target.value)" 
                                               step="0.01" 
                                               min="0" 
                                               max="1"
                                               title="Erfolgswahrscheinlichkeit (p)">
                                        <!-- Kenngrößen Chip -->
                                        <div class="studio-verteilung-metrics-chip" title="Erwartungswert μ und Standardabweichung σ">
                                            <span>μ = <strong x-text="(workingModule.data.n * workingModule.data.p).toFixed(2)"></strong></span>
                                            <span class="metrics-sep">|</span>
                                            <span>σ = <strong x-text="Math.sqrt(workingModule.data.n * workingModule.data.p * (1 - workingModule.data.p)).toFixed(2)"></strong></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Parameter für Normalverteilung -->
                                <template x-if="workingModule.data.type === 'normal'">
                                    <div class="studio-toolbar-group">
                                        <span class="studio-group-label">Parameter:</span>
                                        <label class="studio-dim-label">μ =</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               :value="workingModule.data.mu" 
                                               @input="setVerteilungMu($event.target.value)" 
                                               step="1" 
                                               title="Erwartungswert (Mittelwert μ)">
                                        <label class="studio-dim-label margin-left-xs">σ =</label>
                                        <input type="number" 
                                               class="studio-number-input studio-dim-input" 
                                               :value="workingModule.data.sigma" 
                                               @input="setVerteilungSigma($event.target.value)" 
                                               step="0.5" 
                                               min="0.01" 
                                               title="Standardabweichung (σ)">
                                        <!-- Kenngrößen Chip -->
                                        <div class="studio-verteilung-metrics-chip" title="1σ-Intervall">
                                            <span>1σ-Intervall: [<strong><span x-text="(Number(workingModule.data.mu) - Number(workingModule.data.sigma)).toFixed(1)"></span></strong> ; <strong><span x-text="(Number(workingModule.data.mu) + Number(workingModule.data.sigma)).toFixed(1)"></span></strong>]</span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Bereich markieren P(a <= X <= b) -->
                                <div class="studio-toolbar-group studio-grow-group">
                                    <label class="studio-checkbox-label">
                                        <input type="checkbox" 
                                               :checked="workingModule.data.markArea && workingModule.data.markArea.show" 
                                               @change="toggleVerteilungMarkArea()">
                                        <span>Bereich markieren:</span>
                                    </label>
                                    <template x-if="workingModule.data.markArea && workingModule.data.markArea.show">
                                        <div class="studio-inline-inputs">
                                            <label class="studio-dim-label">von</label>
                                            <input type="number" 
                                                   class="studio-number-input studio-dim-input" 
                                                   x-model.number="workingModule.data.markArea.min" 
                                                   @input="touchRender()" 
                                                   title="Untere Grenze">
                                            <label class="studio-dim-label">bis</label>
                                            <input type="number" 
                                                   class="studio-number-input studio-dim-input" 
                                                   x-model.number="workingModule.data.markArea.max" 
                                                   @input="touchRender()" 
                                                   title="Obere Grenze">

                                            <!-- Schnell-Intervalle Pills -->
                                            <template x-if="workingModule.data.type === 'binomial'">
                                                <div class="studio-interval-pills">
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('links')" title="P(X ≤ μ)">P(X ≤ μ)</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('rechts')" title="P(X ≥ μ)">P(X ≥ μ)</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('sigma1')" title="1σ-Umgebung (ca. 68%)">±1σ</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('sigma2')" title="2σ-Umgebung (ca. 95%)">±2σ</button>
                                                </div>
                                            </template>
                                            <template x-if="workingModule.data.type === 'normal'">
                                                <div class="studio-interval-pills">
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('sigma1')" title="1σ-Umgebung: 68.3%">±1σ (68%)</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('95pct')" title="95%-Intervall: ±1.96σ">95%</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('sigma2')" title="2σ-Umgebung: 95.4%">±2σ (95%)</button>
                                                    <button type="button" class="studio-mini-pill" @click="applyVerteilungIntervalPreset('99pct')" title="99%-Intervall: ±2.58σ">99%</button>
                                                </div>
                                            </template>

                                            <!-- Berechnete Wahrscheinlichkeit Badge -->
                                            <span class="studio-prob-badge" x-text="getVerteilungCalculatedProb()"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Canvas Area: Live-Druckvorschau -->
                            <div class="studio-verteilung-canvas-area" @click="handleVerteilungCanvasClick($event)">
                                <div class="studio-preview-sheet">
                                    <div class="studio-sheet-header">
                                        <span class="studio-sheet-title" x-text="workingModule.data.type === 'normal' ? 'Normalverteilung' : 'Binomialverteilung'"></span>
                                        <span class="studio-sheet-status" x-text="getVerteilungStatusText()"></span>
                                    </div>
                                    <div class="studio-verteilung-container">
                                        <div class="verteilung-svg-box" x-html="getVerteilungPreviewSvg()"></div>
                                    </div>
                                    <div class="studio-sheet-footer">
                                        <span class="studio-sheet-note">Vorschau entspricht 1:1 dem A4-Druckbild</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Fallback für Module ohne dediziertes Studio -->
                    <template x-if="workingModule && workingModule.type !== 'baum' && workingModule.type !== 'vierfeldertafel' && workingModule.type !== 'urne' && workingModule.type !== 'gluecksrad' && workingModule.type !== 'diagramm' && workingModule.type !== 'verteilung'">
                        <div class="studio-fallback-box">
                            <p>Die Detail-Konfiguration für dieses Modul wird geladen...</p>
                        </div>
                    </template>

                </div>

                <!-- Modal Footer -->
                <footer class="modal-footer module-studio-footer">
                    <div class="module-studio-footer-hint">
                        <template x-if="workingModule && workingModule.type === 'baum'">
                            <span>💡 <strong>Direktbearbeitung:</strong> Klicke auf einen Ast oder Knoten, um ihn zu bearbeiten. Mit <strong>Tab</strong> springst du zum nächsten Element.</span>
                        </template>
                        <template x-if="workingModule && workingModule.type === 'vierfeldertafel'">
                            <span>💡 <strong>Direktbearbeitung:</strong> Klicke auf ein Feld oder eine Beschriftung, um sie zu bearbeiten. Mit <strong>Tab / Enter</strong> springst du weiter.</span>
                        </template>
                        <template x-if="workingModule && workingModule.type === 'urne'">
                            <span>💡 <strong>Direktbearbeitung:</strong> Klicke auf eine Kugel, um ihre Farbe oder Beschriftung zu ändern. Mit den Werkzeugen oben kannst du Kugeln hinzufügen oder mischen.</span>
                        </template>
                        <template x-if="workingModule && workingModule.type === 'gluecksrad'">
                            <span>💡 <strong>Direktbearbeitung:</strong> Klicke auf einen Sektor, um Farbe, Text oder Größe (Gewicht) anzupassen. Das Gewicht steuert direkt den Mittelpunktswinkel.</span>
                        </template>
                        <template x-if="workingModule && workingModule.type === 'diagramm'">
                            <span>💡 <strong>Direktbearbeitung:</strong> Klicke auf eine Säule oder einen Punkt im Diagramm, um Wert und Beschriftung direkt zu ändern. Im Modus <em>"Einzeichnen"</em> wird für Schüler ein leeres Achsengitter gedruckt.</span>
                        </template>
                        <template x-if="workingModule && workingModule.type === 'verteilung'">
                            <span>💡 <strong>Didaktik-Tipp:</strong> Wähle zwischen diskreter Binomialverteilung (Säulen) und stetiger Normalverteilung (Gauß-Kurve). Über "Bereich markieren" hebst du Wahrscheinlichkeitsintervalle wie \(P(a \le X \le b)\) oder \(\sigma\)-Umgebungen für Schüler hervor.</span>
                        </template>
                    </div>
                    <div class="module-studio-footer-actions">
                        <button type="button" class="btn-secondary" @click="cancelAndClose()">Abbrechen</button>
                        <button type="button" class="btn-primary btn-width-auto" @click="saveAndClose()">Übernehmen ✓</button>
                    </div>
                </footer>
            </div>
        </div>
    </template>
</div>
