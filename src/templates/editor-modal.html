    <template x-if="isModalOpen">
        <div class="modal-overlay" @click.self="closeTaskModal()">
            <div class="modal-content">
                <header class="modal-header">
                    <div class="modal-header-title-group">
                        <h2 x-text="editingTask?.type === 'section' ? (tasks.some(t => t.id === editingTask?.id) ? 'Abschnitt bearbeiten' : 'Neuen Abschnitt einfügen') : (tasks.some(t => t.id === editingTask?.id) ? 'Aufgabe bearbeiten' : 'Neue Aufgabe')"></h2>
                        <template x-if="editingTask && editingTask.type !== 'section'">
                            <span class="task-total-points-badge">
                                Gesamt: <strong x-text="getTaskPoints(editingTask)"></strong> P.
                            </span>
                        </template>
                    </div>
                    <button class="btn-secondary btn-close-modal" @click="closeTaskModal()">&times;</button>
                </header>
                
                <div class="modal-body">
                    <!-- SECTION EDITOR (Only for type 'section') -->
                    <template x-if="editingTask && editingTask.type === 'section'">
                        <div class="section-editor">
                            <div class="input-group">
                                <label>Titel des Abschnitts (z.B. Teil 1)</label>
                                <input type="text" x-model="editingTask.title" placeholder="z.B. Teil A: Hilfsmittelfreier Teil">
                            </div>
                            <div class="input-group">
                                <label>Untertitel / Hinweis (z.B. hilfsmittelfrei)</label>
                                <input type="text" x-model="editingTask.subtitle" placeholder="z.B. Bearbeitungszeit: 20 Min. / Keine Taschenrechner">
                            </div>
                        </div>
                    </template>

                    <!-- TASK EDITOR (Only for type !== 'section') -->
                    <template x-if="editingTask && editingTask.type !== 'section'">
                        <div>
                            <!-- Globale Aufgaben-Einstellungen (Top-Bar) -->
                            <div class="task-global-settings-bar">
                                <div class="settings-bar-title">
                                    <span>⚙️</span>
                                    <span>Aufgaben-Einstellungen</span>
                                </div>
                                <div class="settings-bar-controls">
                                    <div class="settings-item">
                                        <span>Spalten im Druck:</span>
                                        <select x-model.number="editingTask.subtaskColumns" class="compact-select">
                                            <option value="1">1 Spalte (Standard)</option>
                                            <option value="2">2 Spalten</option>
                                            <option value="3">3 Spalten</option>
                                        </select>
                                    </div>
                                    <div class="settings-item">
                                        <span>Leerzeilen vor Aufgabe:</span>
                                        <input type="number" x-model.number="editingTask.spacingTop" min="0" max="15" class="compact-number-input spacing-input">
                                    </div>
                                    <div class="settings-item">
                                        <label class="checkbox-label compact-checkbox-label" title="Aufgabe auf neuer A4-Seite beginnen">
                                            <input type="checkbox" x-model="editingTask.pageBreakBefore">
                                            <span>Neue Seite</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="editor-hierarchical-layout">
                                <!-- Ebene 1: Allgemeiner Sachkontext (Volle Breite) -->
                                <section class="editor-context-card">
                                    <div class="context-header">
                            <div class="header-left-group">
                                <label class="modal-section-label">Allgemeiner Sachkontext (Optional)</label>
                                <button type="button" class="btn-math btn-special btn-compact btn-expandable" @click="openVisualEditor(editingTask, 'context-ta', 'context')"><span class="btn-icon"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3 9 6-18h6" /></svg></span><span class="btn-expand-text">Formel</span></button>
                                <button type="button" class="btn-math btn-compact" x-show="editingTask.lueckentext.show" @click="wrapClozeText(editingTask, 'context-ta', 'context')">🔤 Lücke</button>
                                
                                <!-- Unified Module Controls for Context (Modal) -->
                                <button type="button" class="btn-add-module btn-expandable" @click="openModuleModal(editingTask)">
                                    <span class="btn-icon"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span><span class="btn-expand-text">Modul hinzufügen</span>
                                </button>
                            </div>
                        </div>
                        <textarea id="context-ta" x-model="editingTask.context" placeholder="Beschreiben Sie hier den Kontext der Aufgabe..." class="compact-textarea"></textarea>
                        
                        <!-- Active Pills (Neue Architektur: x-for über modules[]) -->
                        <div class="active-pills-row">
                            <template x-for="module in (editingTask.modules || [])" :key="module.id">
                                <div class="active-pill-group">
                                    <button type="button" class="active-pill-btn" @click="openModuleStudio(editingTask, module)" title="Modul bearbeiten">
                                        <span class="active-pill-icon" x-text="getModuleIcon(module.type)"></span>
                                        <span x-text="getModuleDisplayName(module.type)"></span>
                                        <span class="active-pill-edit-icon">✏️</span>
                                    </button>
                                    <button type="button" class="active-pill-delete-btn" @click="removeModuleById(editingTask, module.id)" title="Modul entfernen">✕</button>
                                </div>
                            </template>
                        </div>
                        
                        <!-- Special Configs -->
                        <div class="module-configs">
                            <div x-show="editingTask.trueFalse && editingTask.trueFalse.show" class="height-config">
                                <span>Begründung (Höhe):</span>
                                <input type="number" x-model="editingTask.trueFalse.spaceHeight" min="1" max="15">
                                <span>cm</span>
                            </div>
                        </div>

                        <!-- Editor Modules for Context (Platzhalter: spezifische Editoren werden über Modul-Modal gesteuert) -->
                        <div class="context-modules-editors">
                            <!-- Hinweis bei Lückentext-Modul -->
                            <template x-if="(editingTask.modules || []).some(m => m.type === 'lueckentext')">
                                <div class="lueckentext-hint" style="margin-bottom: 0.5rem;">
                                    Tipp: Markiere Text im Kontext-Feld und klicke auf 'Lücke' (oben), um ihn im Druck zu verbergen.
                                </div>
                            </template>
                            
                            <div x-show="editingTask.zusatz.show" class="zusatz-input-wrapper" style="margin-bottom: 0.5rem;">
                                <input type="text" x-model="editingTask.zusatz.text" placeholder="z.B. [Zur Kontrolle: x = 5]" class="zusatz-input">
                            </div>

                            <!-- Matching Editor -->
                            <div x-show="editingTask.matching.show" class="matching-editor-container compact-editor">
                                <div class="matching-editor-grid">
                                    <div class="matching-editor-column">
                                        <label class="compact-label">Linke Seite</label>
                                        <template x-for="(item, lIdx) in editingTask.matching.leftItems" :key="item.id">
                                            <div class="matching-item-row">
                                                <input type="text" x-model="item.text" placeholder="Begriff..." class="matching-input">
                                                <button type="button" class="btn-icon-small" @click="removeMatchingLeftItem(editingTask, item.id)" x-show="editingTask.matching.leftItems.length > 1">✕</button>
                                            </div>
                                        </template>
                                        <button type="button" class="btn-secondary btn-small" @click="addMatchingLeftItem(editingTask)">➕ Begriff</button>
                                    </div>
                                    <div class="matching-editor-column">
                                        <label class="compact-label">Rechte Seite</label>
                                        <template x-for="(item, rIdx) in editingTask.matching.rightItems" :key="item.id">
                                            <div class="matching-item-row">
                                                <input type="text" x-model="item.text" placeholder="Zuordnung..." class="matching-input">
                                                <button type="button" class="btn-icon-small" @click="removeMatchingRightItem(editingTask, item.id)" x-show="editingTask.matching.rightItems.length > 1">✕</button>
                                            </div>
                                        </template>
                                        <button type="button" class="btn-secondary btn-small" @click="addMatchingRightItem(editingTask)">➕ Begriff</button>
                                    </div>
                                </div>
                            </div>

                            <!-- MCQ Editor -->
                            <div x-show="editingTask.mcq.show" class="mcq-editor-container compact-editor">
                                <template x-for="(option, oIdx) in editingTask.mcq.options" :key="option.id">
                                    <div class="mcq-option-row">
                                        <div class="mcq-option-marker"></div>
                                        <input type="text" x-model="option.text" placeholder="Option eingeben..." class="mcq-option-input">
                                        <button type="button" class="btn-icon-small" @click="removeMCQOption(editingTask, option.id)" x-show="editingTask.mcq.options.length > 1">✕</button>
                                    </div>
                                </template>
                                <button type="button" class="btn-secondary btn-small" @click="addMCQOption(editingTask)">➕ Option hinzufügen</button>
                            </div>

                            <!-- Image Grid Editor (Context) -->
                            <div x-show="editingTask.image && editingTask.image.show" class="image-editor-container compact-editor">
                                <div class="image-grid-settings">
                                    <div class="grid-input-group">
                                        <label>Grid:</label>
                                        <input type="number" x-model.number="editingTask.image.rows" min="1" max="3" @change="changeGridLayout(editingTask)" class="grid-num-input">
                                        <span>x</span>
                                        <input type="number" x-model.number="editingTask.image.cols" min="1" max="3" @change="changeGridLayout(editingTask)" class="grid-num-input">
                                    </div>
                                    <div class="width-config">
                                        <div class="number-stepper">
                                            <span>Max. Höhe:</span>
                                            <button type="button" @click="editingTask.image.maxHeight = Math.max(1, parseFloat(editingTask.image.maxHeight) - 0.5)">-</button>
                                            <input type="number" x-model.number="editingTask.image.maxHeight" step="0.5" min="1" max="15">
                                            <button type="button" @click="editingTask.image.maxHeight = Math.min(15, parseFloat(editingTask.image.maxHeight) + 0.5)">+</button>
                                            <span>cm</span>
                                        </div>
                                    </div>
                                    <div class="width-config">
                                        <div class="number-stepper">
                                            <span>Breite:</span>
                                            <button type="button" @click="editingTask.image.width = Math.max(2, parseFloat(editingTask.image.width) - 0.5)">-</button>
                                            <input type="number" x-model.number="editingTask.image.width" step="0.5" min="2" max="18">
                                            <button type="button" @click="editingTask.image.width = Math.min(18, parseFloat(editingTask.image.width) + 0.5)">+</button>
                                            <span>cm</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="image-grid-editor" :style="`grid-template-columns: repeat(${editingTask.image.cols}, 1fr);`">
                                    <template x-for="(slot, index) in editingTask.image.slots" :key="index">
                                        <div class="grid-slot" 
                                             :class="{'active': editingTask.image.activeIndex === index}" 
                                             @click="editingTask.image.activeIndex = index">
                                            <button type="button" x-show="slot" @click.stop="clearImageSlot(editingTask, index)" class="btn-delete-image" title="Bild entfernen">×</button>
                                            <template x-if="slot">
                                                <img :src="slot">
                                            </template>
                                            <template x-if="!slot">
                                                <div class="slot-placeholder">
                                                    <span>➕ Slot <span x-text="index + 1"></span></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <div class="image-upload-row">
                                    <input type="file" accept="image/*" @change="handleImageUpload(editingTask, $event)" class="image-file-input">
                                    <p class="image-paste-hint">Tipp: Slot anklicken und Screenshot mit <strong>Strg+V</strong> einfügen.</p>
                                </div>
                            </div>

                             <!-- Context LGS Editor -->
                             <div x-show="editingTask.lgs && editingTask.lgs.show" class="lgs-editor-container compact-editor">
                                 <div class="editor-module-header">
                                     <span class="module-title-badge">📟 LGS-Generator</span>
                                     <button type="button" class="btn-mini-tour" @click="window.dispatchEvent(new CustomEvent('start-onboarding-tour', { detail: { type: 'lgs', container: $event.target.closest('.lgs-editor-container') } }))" title="Interaktive Modul-Tour starten">🚀 Tour</button>
                                 </div>
                                 <div class="lgs-editor-row flex-wrap">
                                     <div class="input-group-inline">
                                         <label class="compact-label">Dimension:</label>
                                         <select x-model.number="editingTask.lgs.dimension" @change="onLgsDimensionChange(editingTask.lgs)" class="compact-select select-lgs-dim">
                                             <option :value="2">2x2 LGS</option>
                                             <option :value="3">3x3 LGS</option>
                                         </select>
                                     </div>
                                     
                                     <div class="input-group-inline">
                                         <label class="compact-label">Modus:</label>
                                         <div class="segmented-control">
                                             <button type="button" :class="{ 'active': editingTask.lgs.mode === 'generate' }" @click="editingTask.lgs.mode = 'generate'" class="seg-btn">Auto-Generator</button>
                                             <button type="button" :class="{ 'active': editingTask.lgs.mode === 'manual' }" @click="editingTask.lgs.mode = 'manual'" class="seg-btn">Manuell</button>
                                         </div>
                                     </div>

                                     <div class="input-group-inline">
                                         <label class="compact-label">Variablen:</label>
                                         <input type="text" x-model="editingTask.lgs.variablesRaw" class="compact-input input-lgs-vars" placeholder="x, y">
                                     </div>
                                 </div>

                                 <!-- Mode: Generate -->
                                 <div x-show="editingTask.lgs.mode === 'generate'" class="lgs-generate-section">
                                     <p class="lgs-section-hint">Geben Sie ganzzahlige Wunsch-Lösungen ein. Das System berechnet automatisch passende ganzzahlige Koeffizienten.</p>
                                     <div class="lgs-solutions-grid">
                                         <template x-for="(sol, idx) in Array.from({ length: editingTask.lgs.dimension })" :key="idx">
                                             <div class="sol-input-group">
                                                 <label class="compact-label" x-text="`Lösung für ${ (editingTask.lgs.variablesRaw || '').split(',')[idx]?.trim() || ['x','y','z'][idx] }:`"></label>
                                                 <input type="number" x-model="editingTask.lgs.targetSolutions[idx]" class="compact-input input-lgs-sol" placeholder="3">
                                             </div>
                                         </template>
                                         <button type="button" class="btn-secondary btn-small btn-generate-lgs" @click="generateLGS(editingTask.lgs)">🎲 Gleichungen erzeugen</button>
                                     </div>
                                 </div>

                                 <!-- Mode: Manual -->
                                 <div x-show="editingTask.lgs.mode === 'manual'" class="lgs-manual-section">
                                     <p class="lgs-section-hint">Tragen Sie die Koeffizienten direkt in die Felder ein (z.B. a·x + b·y = c):</p>
                                     <div class="lgs-manual-equations-grid" :class="editingTask.lgs.dimension === 3 ? 'grid-3x3' : 'grid-2x2'">
                                         <template x-for="(row, rIdx) in Array.from({ length: editingTask.lgs.dimension })" :key="rIdx">
                                             <div class="lgs-equation-row">
                                                 <span class="eq-num-label" x-text="['I:', 'II:', 'III:'][rIdx]"></span>
                                                 
                                                 <!-- Term 1 -->
                                                 <div class="lgs-term-input">
                                                     <input type="text" x-model="editingTask.lgs.manualCoefficients[rIdx][0]" class="coeff-input" placeholder="a">
                                                     <span class="coeff-var" x-text="(editingTask.lgs.variablesRaw || '').split(',')[0]?.trim() || 'x'"></span>
                                                 </div>

                                                 <!-- Term 2 -->
                                                 <span class="eq-operator">+</span>
                                                 <div class="lgs-term-input">
                                                     <input type="text" x-model="editingTask.lgs.manualCoefficients[rIdx][1]" class="coeff-input" placeholder="b">
                                                     <span class="coeff-var" x-text="(editingTask.lgs.variablesRaw || '').split(',')[1]?.trim() || 'y'"></span>
                                                 </div>

                                                 <!-- Term 3 (for 3x3) -->
                                                 <template x-if="editingTask.lgs.dimension === 3">
                                                     <div class="lgs-term-input-group">
                                                         <span class="eq-operator">+</span>
                                                         <div class="lgs-term-input">
                                                             <input type="text" x-model="editingTask.lgs.manualCoefficients[rIdx][2]" class="coeff-input" placeholder="c">
                                                             <span class="coeff-var" x-text="(editingTask.lgs.variablesRaw || '').split(',')[2]?.trim() || 'z'"></span>
                                                         </div>
                                                     </div>
                                                 </template>

                                                 <span class="eq-equals">=</span>
                                                 <input type="text" x-model="editingTask.lgs.manualCoefficients[rIdx][editingTask.lgs.dimension]" class="coeff-input constant-input" placeholder="d">
                                             </div>
                                         </template>
                                     </div>
                                 </div>
                             </div>

                        <!-- Context Table Editor -->
                        <div x-show="editingTask.table.show" class="table-editor-grid compact-editor">
                            <div class="editor-module-header">
                                <span class="module-title-badge">📊 Wertetabelle</span>
                                <button type="button" class="btn-mini-tour" @click="window.dispatchEvent(new CustomEvent('start-onboarding-tour', { detail: { type: 'table', container: $event.target.closest('.table-editor-grid') } }))" title="Interaktive Modul-Tour starten">🚀 Tour</button>
                            </div>
                            <div class="table-meta-inputs">
                                <input type="text" x-model="editingTask.table.xValues" placeholder="x">
                                <input type="text" x-model="editingTask.table.yValues" placeholder="f(x)">
                            </div>
                            <div class="table-autofill-section">
                                <div class="input-group-inline">
                                    <input type="text" x-model="editingTask.table.formula" placeholder="Funktion (z.B. x^2)">
                                    <button type="button" class="btn-secondary btn-small" @click="autofillTable(editingTask)">Berechnen</button>
                                </div>
                            </div>
                            <div class="table-values-scroll">
                                <table class="editor-table">
                                    <tr>
                                        <template x-for="(val, idx) in editingTask.table.data[0]">
                                            <td><input type="text" x-model="editingTask.table.data[0][idx]"></td>
                                        </template>
                                    </tr>
                                    <tr>
                                        <template x-for="(val, idx) in editingTask.table.data[1]">
                                            <td><input type="text" x-model="editingTask.table.data[1][idx]"></td>
                                        </template>
                                    </tr>
                                </table>
                            </div>
                            <div class="table-actions">
                                <button type="button" class="btn-icon-small" @click="addColumn(editingTask)">➕</button>
                                <button type="button" class="btn-icon-small" @click="removeColumn(editingTask)">➖</button>
                            </div>
                        </div>

                        <!-- Context Kurvendiskussion Editor -->
                        <div x-show="editingTask.geometry.show && getModuleData(editingTask, 'analysis_kurve')" class="analysis-kurve-editor compact-editor">
                            <div class="kurve-editor-grid">
                                <!-- Modus-Auswahl -->
                                <div class="kurve-input-row">
                                    <label class="compact-label">Modus:</label>
                                    <select x-model="editingTask.analysis_kurve.mode" @change="updateKurveCode(editingTask.analysis_kurve)" class="compact-input">
                                        <option value="kurve">Kurvendiskussion</option>
                                        <option value="plot">Einfacher Funktionsplot</option>
                                        <option value="parabel">Spezielle Parabelbetrachtung</option>
                                        <option value="tangente">Tangente anlegen</option>
                                        <option value="integral">Flächenberechnung (Integral)</option>
                                    </select>
                                </div>

                                <!-- Funktionsgleichung f(x) (für alle außer Parabel) -->
                                <div class="kurve-input-row-horizontal" x-show="editingTask.analysis_kurve.mode !== 'parabel'">
                                    <div class="flex-grow-input-third">
                                        <label class="compact-label">Name:</label>
                                        <input type="text" x-model="editingTask.analysis_kurve.functionName" @input="updateKurveCode(editingTask.analysis_kurve)" class="compact-input" placeholder="z.B. f">
                                    </div>
                                    <div class="flex-grow-input">
                                        <label class="compact-label">Funktionsgleichung:</label>
                                        <input type="text" x-model="editingTask.analysis_kurve.formula" @input="updateKurveCode(editingTask.analysis_kurve)" class="compact-input" placeholder="z.B. 0.2*x^3 - 1.2*x">
                                    </div>
                                </div>

                                <!-- MODUS: Kurvendiskussion -->
                                <div class="kurve-options-grid" x-show="editingTask.analysis_kurve.mode === 'kurve' || !editingTask.analysis_kurve.mode">
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.showNullstellen" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        Nullstellen (N)
                                    </label>
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.showExtrema" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        Extrempunkte (HP/TP)
                                    </label>
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.showWendepunkte" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        Wendepunkte (WP)
                                    </label>
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.showDeriv1" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        1. Ableitung f'(x)
                                    </label>
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.showDeriv2" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        2. Ableitung f''(x)
                                    </label>
                                </div>

                                <!-- MODUS: Einfacher Plot -->
                                <div class="kurve-input-row" x-show="editingTask.analysis_kurve.mode === 'plot'">
                                    <label class="kurve-checkbox-label">
                                        <input type="checkbox" x-model="editingTask.analysis_kurve.enableG" @change="updateKurveCode(editingTask.analysis_kurve)">
                                        Zweite Funktion aktivieren
                                    </label>
                                </div>
                                <div class="kurve-input-row-horizontal" x-show="editingTask.analysis_kurve.mode === 'plot' && editingTask.analysis_kurve.enableG">
                                    <div class="flex-grow-input-third">
                                        <label class="compact-label">Name g:</label>
                                        <input type="text" x-model="editingTask.analysis_kurve.functionName2" @input="updateKurveCode(editingTask.analysis_kurve)" class="compact-input" placeholder="z.B. g">
                                    </div>
                                    <div class="flex-grow-input">
                                        <label class="compact-label">Zweite Funktionsgleichung:</label>
                                        <input type="text" x-model="editingTask.analysis_kurve.formula2" @input="updateKurveCode(editingTask.analysis_kurve)" class="compact-input" placeholder="z.B. x - 1">
                                    </div>
                                </div>

                                <!-- MODUS: Parabel (Formularwahl) -->
                                <div class="kurve-input-row-horizontal" x-show="editingTask.analysis_kurve.mode === 'parabel'">
                                    <div class="flex-grow-input-half">
                                        <label class="compact-label">Name:</label>
                                        <input type="text" x-model="editingTask.analysis_kurve.functionName" @input="updateKurveCode(editingTask.analysis_kurve)" class="compact-input" placeholder="z.B. f">
                                    </div>
                                    <div class="flex-grow-input-half">
                                        <label class="compact-label">Form:</label>
                                        <select x-model="editingTask.analysis_kurve.parabolaForm" @change="updateKurveCode(editingTask.analysis_kurve)" class="compact-input">
                                            <option value="vertex">Scheitelpunktform: a(x-d)² + e</option>
                                            <option value="general">Allgemeine Form: ax² + bx + c</option>
                                        </select>
                                    </div>

                                                                                     <span>H:</span><input type="number" x-model="el.h" step="0.5" class="el-num-input">
                                                                                 </div>
                                                                                 <span>Tr.:</span><input type="number" x-model="el.fillOpacity" step="0.1" min="0" max="1" class="el-num-input el-num-input-35">
                                                                             </div>
                                                                         </div>
                                                                     </template>
                                                                     
                                                                     <template x-if="el.type === 'pyramid3d'">
                                                                         <div class="geo-element-editor">
                                                                             <div class="geo-inputs-row">
                                                                                 <div class="geo-coord-box">
                                                                                     <span class="geo-point-label">Zentrum Basis</span>
                                                                                     <span>X:</span><input type="number" x-model="el.center.x" step="0.5" class="el-num-input">
                                                                                     <span>Y:</span><input type="number" x-model="el.center.y" step="0.5" class="el-num-input">
                                                                                     <span>Z:</span><input type="number" x-model="el.center.z" step="0.5" class="el-num-input">
                                                                                 </div>
                                                                                 <div class="geo-coord-box">
                                                                                     <span>Seite:</span><input type="number" x-model="el.s" step="0.5" class="el-num-input">
                                                                                     <span>Höhe:</span><input type="number" x-model="el.h" step="0.5" class="el-num-input">
                                                                                 </div>
                                                                                 <span>Tr.:</span><input type="number" x-model="el.fillOpacity" step="0.1" min="0" max="1" class="el-num-input el-num-input-35">
                                                                             </div>
                                                                         </div>
                                                                     </template>
                                                                     
                                                                     <template x-if="el.type === 'polyhedron3d'">
                                                                         <div class="geo-element-editor">
                                                                             <div class="geo-inputs-row flex-column-start">
                                                                                 <div class="flex-row-center">
                                                                                     <span class="geo-point-label">Flächen (Indices):</span>
                                                                                     <input type="text" x-model="el.faces" placeholder="0,1,2; 0,1,3..." class="el-text-input">
                                                                                     <span>Tr.:</span><input type="number" x-model="el.fillOpacity" step="0.1" min="0" max="1" class="el-num-input el-num-input-35">
                                                                                 </div>
                                                                                 <div class="vertices-list">
                                                                                     <template x-for="(v, idx) in el.vertices" :key="idx">
                                                                                         <div class="vertex-row">
                                                                                             <span class="vertex-idx" x-text="idx"></span>
                                                                                             <input type="number" x-model="v.x" step="0.5" class="el-num-input el-num-input-35">
                                                                                             <input type="number" x-model="v.y" step="0.5" class="el-num-input el-num-input-35">
                                                                                             <input type="number" x-model="v.z" step="0.5" class="el-num-input el-num-input-35">
                                                                                             <button type="button" class="btn-remove-vertex" @click="el.vertices.splice(idx, 1)">×</button>
                                                                                         </div>
                                                                                     </template>
                                                                                     <button type="button" class="btn-add-vertex" @click="el.vertices.push({x:0,y:0,z:0})">+ Punkt</button>
                                                                                 </div>
                                                                             </div>
                                                                         </div>
                                                                     </template>
                                                                     
                                                                     <button type="button" class="btn-icon-small" @click="removeGeometry3dElement(subSub, el.id)">✕</button>
                                                                 </div>
                                                             </template>
                                                         </div>
                                                         <div class="geometry-code-label">Erweiterter JSXGraph Code (3D):</div>
                                                         <textarea x-model="subSub.geometry3d.code" placeholder="Zusätzlicher Code (board, view, JXG are available)..." class="code-editor-textarea"></textarea>
                                                     </div>

                                                    <!-- Bild (Image) Editor -->
                                                    <div x-show="getModuleData(subSub, 'image')" class="image-editor-container compact-editor">
                                                         <div class="image-grid-settings">
                                                             <div class="grid-input-group">
                                                                 <label>Grid:</label>
                                                                 <input type="number" x-model.number="subSub.image.rows" min="1" max="3" @change="changeGridLayout(subSub)" class="grid-num-input">
                                                                 <span>x</span>
                                                                 <input type="number" x-model.number="subSub.image.cols" min="1" max="3" @change="changeGridLayout(subSub)" class="grid-num-input">
                                                             </div>
                                                             <div class="width-config">
                                                                 <div class="number-stepper">
                                                                     <span>Max. Höhe:</span>
                                                                     <button type="button" @click="subSub.image.maxHeight = Math.max(1, parseFloat(subSub.image.maxHeight) - 0.5)">-</button>
                                                                     <input type="number" x-model.number="subSub.image.maxHeight" step="0.5" min="1" max="15">
                                                                     <button type="button" @click="subSub.image.maxHeight = Math.min(15, parseFloat(subSub.image.maxHeight) + 0.5)">+</button>
                                                                     <span>cm</span>
                                                                 </div>
                                                             </div>
                                                             <div class="width-config">
                                                                 <div class="number-stepper">
                                                                     <span>Breite:</span>
                                                                     <button type="button" @click="subSub.image.width = Math.max(2, parseFloat(subSub.image.width) - 0.5)">-</button>
                                                                     <input type="number" x-model.number="subSub.image.width" step="0.5" min="2" max="18">
                                                                     <button type="button" @click="subSub.image.width = Math.min(18, parseFloat(subSub.image.width) + 0.5)">+</button>
                                                                     <span>cm</span>
                                                                 </div>
                                                             </div>
                                                         </div>
                                                         
                                                         <div class="image-grid-editor" :style="`grid-template-columns: repeat(${subSub.image.cols}, 1fr);`">
                                                             <template x-for="(slot, index) in subSub.image.slots" :key="index">
                                                                 <div class="grid-slot" 
                                                                      :class="{'active': subSub.image.activeIndex === index}" 
                                                                      @click="subSub.image.activeIndex = index">
                                                                     <button type="button" x-show="slot" @click.stop="clearImageSlot(subSub, index)" class="btn-delete-image" title="Bild entfernen">×</button>
                                                                     <template x-if="slot">
                                                                         <img :src="slot">
                                                                     </template>
                                                                     <template x-if="!slot">
                                                                         <div class="slot-placeholder">
                                                                             <span>➕ Slot <span x-text="index + 1"></span></span>
                                                                         </div>
                                                                     </template>
                                                                 </div>
                                                             </template>
                                                         </div>
                                                         
                                                         <div class="image-upload-row">
                                                             <input type="file" accept="image/*" @change="handleImageUpload(subSub, $event)" class="image-file-input">
                                                             <p class="image-paste-hint">Tipp: Slot anklicken und Screenshot mit <strong>Strg+V</strong> einfügen.</p>
                                                         </div>
                                                     </div>
                                                </div>
                                        </div>
                                        </div>
                                        </template>
                                        
                                        <!-- Add Sub-Subtask Button -->
                                        <button type="button" class="btn-add-sub-subtask" @click="addSubSubtask(subtask)">
                                            ➕ Unteraufgabe hinzufügen
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <button class="btn-add-subtask-hierarchical" @click="addSubtask()">
                            ➕ Teilaufgabe hinzufügen
                        </button>
                    </section> <!-- Ende .subtasks-hierarchical-section -->
                    </div> <!-- Ende .editor-hierarchical-layout -->
                    </div>
            </template>
        </div>

                <footer class="modal-footer">
                    <button class="btn-secondary" @click="closeTaskModal()">Abbrechen</button>
                    <button class="btn-primary btn-width-auto" @click="saveTask()">Speichern</button>
                </footer>
            </div>
        </div>
    </template>
