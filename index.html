<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AufgabenDesigner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css?v=1.1">
    <link rel="stylesheet" href="css/builder-ui.css?v=1.1">
    <link rel="stylesheet" href="css/a4-canvas.css?v=1.1">
    <link rel="stylesheet" href="css/print.css?v=1.1">
    
    <!-- JSXGraph for Geometry and Graphs -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>

    <!-- KaTeX CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Math.js for calculation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- MathLive for Visual Formula Editor -->
    <script defer src="https://unpkg.com/mathlive"></script>

    <!-- JS (State & App) -->
    <script type="module" src="/src/app.ts"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body x-data="builder" @paste.window="handleGlobalPaste($event)">
    
    <!-- Top App Header -->
    <header class="app-header">
        <div class="header-left">
            <button @click="isSidebarOpen = !isSidebarOpen" 
                    class="btn-header btn-sidebar-toggle" 
                    :title="isSidebarOpen ? 'Sammlung einklappen' : 'Sammlung ausklappen'">
                <span x-text="isSidebarOpen ? '◀ Sammlung' : '▶ Sammlung'"></span>
            </button>
            <h2 class="app-title" x-text="meta.titel || 'Unbenannte Arbeit'"></h2>
            <button @click="openMetaModal()" class="btn-header">Einstellungen</button>
            <div class="auto-save-status" x-show="lastSaveTime">
                <span class="status-dot"></span>
                <span class="status-text">Auto-Saved</span>
            </div>
        </div>
        <div class="header-right">
            <button @click="resetTest()" class="btn-header" title="Alle Aufgaben löschen und von vorne beginnen">Neu</button>
            <button @click="printDocument()" class="btn-header btn-print">Drucken / PDF</button>
            <button @click="loadFile()" class="btn-header">Laden</button>
            <input type="file" x-ref="fileInput" @change="importFromJSON($event)" accept=".json" class="hidden-file-input">
            <button @click="saveFile()" class="btn-header">Speichern</button>
            <button @click="saveFileAs()" class="btn-header">Speichern unter…</button>
            
            <div x-show="saveMessage" x-transition class="save-toast" x-text="saveMessage"></div>
        </div>
    </header>



    <!-- Sidebar: Builder UI -->
    <include src="./src/templates/sidebar.html"></include>

    <!-- Main Canvas Area -->
    <main class="canvas-area">
        <article class="a4-page" id="main-canvas" :class="{ 'hide-subtask-points': meta.hideSubtaskPoints }">
            <div id="page-breaks-overlay"></div>
            <!-- Header Table -->
            <table class="print-header-table info-table">
                <tr>
                    <td rowspan="3" class="logo-cell">
                        <img src="LOGO-SGL.jpg" alt="School Logo">
                    </td>
                    <th colspan="2" class="title-cell inline-editable-cell" @click="if (activeInlineEditId !== 'meta-header') startInlineEdit('meta-header', 'inline-meta-art')">
                        <template x-if="activeInlineEditId !== 'meta-header'">
                            <div class="inline-cell-display" title="Klicken zum direkten Bearbeiten">
                                <span x-text="[meta.art + (meta.nr ? ' Nr. ' + meta.nr : ''), meta.fach, meta.klasse].filter(p => p && p.trim() !== '').join(' – ') || 'Titel / Klasse eingeben...'"></span>
                            </div>
                        </template>
                        <template x-if="activeInlineEditId === 'meta-header'">
                            <div class="inline-meta-header-editor" @click.stop @keydown.escape.stop="stopInlineEdit('meta-header')" @keydown.enter.stop="stopInlineEdit('meta-header')">
                                <div class="inline-meta-row">
                                    <button type="button" class="inline-doctype-pill" :class="{ 'active': meta.docType === 'test' }" @click="meta.docType = 'test'; if(meta.art === 'Arbeitsblatt' || !meta.art) meta.art = 'Klassenarbeit';">Test</button>
                                    <button type="button" class="inline-doctype-pill" :class="{ 'active': meta.docType === 'worksheet' }" @click="meta.docType = 'worksheet'; if(meta.art === 'Klassenarbeit' || !meta.art) meta.art = 'Arbeitsblatt';">Arbeitsblatt</button>
                                    <input id="inline-meta-art" type="text" x-model="meta.art" placeholder="Art (z.B. Klassenarbeit)" class="inline-header-input input-art">
                                    <input type="text" x-model="meta.nr" placeholder="Nr." class="inline-header-input input-nr" title="Nummer">
                                    <input type="text" x-model="meta.fach" placeholder="Fach" class="inline-header-input input-fach">
                                    <input type="text" x-model="meta.klasse" placeholder="Klasse" class="inline-header-input input-klasse">
                                    <button type="button" class="btn-inline-done" @click.stop="stopInlineEdit('meta-header')" title="Fertig">✓</button>
                                </div>
                            </div>
                        </template>
                    </th>
                </tr>
                <tr>
                    <td class="compact-cell">Datum:</td>
                    <td class="inline-editable-cell" @click="if (activeInlineEditId !== 'meta-datum') startInlineEdit('meta-datum', 'inline-meta-datum')">
                        <template x-if="activeInlineEditId !== 'meta-datum'">
                            <div class="inline-cell-display" title="Klicken, um Datum zu ändern">
                                <span x-text="formatDate(meta.datum) || 'Datum wählen...'"></span>
                            </div>
                        </template>
                        <template x-if="activeInlineEditId === 'meta-datum'">
                            <div class="inline-date-editor" @click.stop>
                                <input id="inline-meta-datum" type="date" x-model="meta.datum" @change="stopInlineEdit('meta-datum')" @blur="stopInlineEdit('meta-datum')" @keydown.escape.stop="stopInlineEdit('meta-datum')" class="inline-header-input">
                            </div>
                        </template>
                    </td>
                </tr>
                <tr>
                    <td class="compact-cell">Name:</td>
                    <td class="empty-write-area"></td>
                </tr>
            </table>

            <table class="print-header-table grading-table atomic-block" x-show="meta.docType === 'test'">
                <tr>
                    <td>Punkte & Note</td>
                    <td>
                        <div class="grading-combined-cell">
                            <div>
                                <span class="points-write-area"></span> / <span x-text="getTotalPoints()"></span> P.
                            </div>
                            <div class="grading-sep"></div>
                            <div>
                                <span class="note-write-area"></span>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Unterschrift Erziehungsberechtigter</td>
                    <td></td>
                </tr>
            </table>
            
            <div class="print-hinweise atomic-block" :class="{ 'is-empty-print-hide': !meta.hinweise || meta.hinweise.trim() === '' }">
                <template x-if="activeInlineEditId !== 'meta-hinweise'">
                    <div class="inline-editable-text hinweise-editable-box" @click="startInlineEdit('meta-hinweise', 'inline-meta-hinweise', meta, 'hinweise')"><span class="hinweise-text-content" x-show="meta.hinweise && meta.hinweise.trim() !== ''" x-text="meta.hinweise"></span><span x-show="!meta.hinweise || meta.hinweise.trim() === ''" class="inline-empty-placeholder">+ Bearbeitungshinweise / Hilfsmittel eingeben (optional)...</span></div>
                </template>
                <template x-if="activeInlineEditId === 'meta-hinweise'">
                    <div class="inline-editor-box" @click.stop>
                        <textarea id="inline-meta-hinweise" x-model="meta.hinweise" @input="autoResizeTextarea($el)" @blur="handleInlineBlur('meta-hinweise')" @keydown.escape.stop="stopInlineEdit('meta-hinweise')" placeholder="z.B. Bearbeitungszeit: 45 Minuten. Taschenrechner erlaubt." class="inline-canvas-textarea"></textarea>
                    </div>
                </template>
            </div>

            <div class="tasks-container">
                <template x-for="(task, index) in tasks" :key="task.id">
                    <div class="task-item-wrapper"
                         :data-task-id="task.id"
                         :class="{ 'is-selected-task': getSelectedTask()?.id === task.id }"
                         @click="if (getSelectedTask()?.id !== task.id) selectCanvasItem(task, task.type === 'section' ? 'section' : 'subtask')">
                        <!-- SECTION DIVIDER -->
                        <template x-if="task.type === 'section'">
                            <div class="section-divider-print atomic-block"
                                 :class="{ 'is-selected-section': getSelectedTask()?.id === task.id }"
                                 @click.stop="selectCanvasItem(task, 'section'); if (activeInlineEditId !== 'section-' + task.id) startInlineEdit('section-' + task.id, 'inline-section-title-' + task.id)">
                                <div class="canvas-gutter-actions" @click.stop>
                                    <button type="button" class="gutter-btn gutter-btn-add" @click="addTaskInline(index)" title="Neue Aufgabe direkt darunter einfügen">+Aufg.</button>
                                    <button type="button" class="gutter-btn" @click="moveTaskUp(index)" :disabled="index <= 0" title="Abschnitt nach oben">↑</button>
                                    <button type="button" class="gutter-btn" @click="moveTaskDown(index)" :disabled="index >= tasks.length - 1" title="Abschnitt nach unten">↓</button>
                                    <button type="button" class="gutter-btn gutter-btn-del" @click="removeTask(task.id)" title="Abschnitt löschen">×</button>
                                </div>
                                <template x-if="activeInlineEditId !== 'section-' + task.id">
                                    <div class="inline-editable-section" title="Klicken zum Bearbeiten">
                                        <div class="section-title" x-text="task.title || 'Abschnittstitel eingeben...'"></div>
                                        <div class="section-subtitle" x-show="task.subtitle" x-text="task.subtitle"></div>
                                        <div class="section-subtitle inline-empty-placeholder" x-show="!task.subtitle">Untertitel hinzufügen (optional)...</div>
                                    </div>
                                </template>
                                <template x-if="activeInlineEditId === 'section-' + task.id">
                                    <div class="inline-section-editor" @click.stop @keydown.escape.stop="stopInlineEdit('section-' + task.id)" @keydown.enter.stop="stopInlineEdit('section-' + task.id)">
                                        <input :id="'inline-section-title-' + task.id" type="text" x-model="task.title" placeholder="Titel des Abschnitts (z.B. Teil A: Hilfsmittelfreier Teil)" class="inline-section-input title-input">
                                        <input type="text" x-model="task.subtitle" placeholder="Optionaler Untertitel (z.B. Ohne Taschenrechner)" class="inline-section-input subtitle-input">
                                        <button type="button" class="btn-inline-done" @click.stop="stopInlineEdit('section-' + task.id)">✓ Fertig</button>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- NORMAL TASK -->
                        <template x-if="task.type !== 'section'">
                            <div class="task-item" :class="{ 'has-manual-break': task.pageBreakBefore }">
                                <!-- Task Line Insertion Slot (Word-Style Spacing & Keyboard/Click Controls) -->
                                <div class="line-insertion-slot"
                                     tabindex="0"
                                     :class="{
                                         'is-collapsed': !task.spacingTop || task.spacingTop === 0,
                                         'has-spacing': task.spacingTop > 0,
                                         ['spacer-lines-' + task.spacingTop]: task.spacingTop > 0,
                                         'is-focused': activeSlotId === 'task-' + task.id
                                     }"
                                     @click="focusLineSlot('task-' + task.id)"
                                     @keydown="handleSlotKeydown($event, task, 'task')"
                                     @blur="blurLineSlot('task-' + task.id)">
                                    <div class="slot-caret"></div>
                                    <template x-if="task.spacingTop > 0">
                                        <div class="slot-spacing-indicator" @click.stop>
                                            <span x-text="task.spacingTop === 1 ? '1 Leerzeile' : task.spacingTop + ' Leerzeilen'"></span>
                                            <button type="button" class="slot-spacing-reset" @click.stop="removeTaskSpacing(task)" title="Leerzeilen zurücksetzen">×</button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Manueller Seitenumbruch-Hinweis -->
                                <template x-if="task.pageBreakBefore">
                                    <div class="manual-page-break-badge">
                                        <span>Neue Seite</span>
                                        <button type="button" class="spacer-btn spacer-btn-del" @click.stop="toggleTaskPageBreak(task)" title="Seitenumbruch aufheben">×</button>
                                    </div>
                                </template>

                                <!-- Task Header -->
                                <div class="task-row header-row atomic-block"
                                     tabindex="0"
                                     :class="{
                                         'manual-page-break': task.pageBreakBefore,
                                         'is-selected-header': getSelectedTask()?.id === task.id && selectedArea === 'context'
                                     }"
                                     @click.stop="selectCanvasItem(task, 'context'); $el.focus()"
                                     @keydown="handleSlotKeydown($event, task, 'task')"
                                     title="Klicken + Enter/Backspace für Leerzeilen vor dieser Aufgabe">
                                    <div class="canvas-gutter-actions" @click.stop>
                                        <button type="button" class="gutter-btn gutter-btn-add" @click="addTaskInline(index)" title="Neue Aufgabe direkt darunter einfügen">+Aufg.</button>
                                        <button type="button" class="gutter-btn gutter-btn-add" @click="addSubtaskInline(task)" title="Teilaufgabe hinzufügen">+a)</button>
                                        <button type="button" class="gutter-btn" @click="moveTaskUp(index)" :disabled="index <= 0" title="Aufgabe nach oben">↑</button>
                                        <button type="button" class="gutter-btn" @click="moveTaskDown(index)" :disabled="index >= tasks.length - 1" title="Aufgabe nach unten">↓</button>
                                        <button type="button" class="gutter-btn gutter-btn-del" @click="removeTask(task.id)" title="Aufgabe löschen">×</button>
                                    </div>
                                    <div class="task-content task-header-flex">
                                        <div class="task-main-header" x-text="'Aufgabe ' + getTaskNumber(task.id)"></div>
                                    </div>
                                    <div class="task-margin" x-show="getTaskPoints(task) > 0 || meta.docType === 'test'">
                                        <template x-if="meta.docType === 'test'">
                                            <div>
                                                <span class="grading-line"></span> / <span x-text="getTaskPoints(task)"></span> P.
                                            </div>
                                        </template>
                                        <template x-if="meta.docType === 'worksheet' && getTaskPoints(task) > 0">
                                            <div>
                                                <span x-text="'(' + getTaskPoints(task) + ' P.)'"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Context (Sachkontext) -->
                                <template x-if="hasContextContent(task) || activeInlineEditId === 'context-' + task.id || (getSelectedTask()?.id === task.id && selectedArea === 'context')">
                                    <div class="task-context atomic-block"
                                         :class="{ 'is-empty-print-hide': !hasContextContent(task), 'is-selected-area': getSelectedTask()?.id === task.id && selectedArea === 'context' }"
                                         @click.stop="selectCanvasItem(task, 'context')">
                                        <template x-if="activeInlineEditId !== 'context-' + task.id">
                                            <div class="inline-editable-text context-editable-area" x-show="!task.trueFalse?.show" @click.stop="selectCanvasItem(task, 'context'); startInlineEdit('context-' + task.id, 'inline-context-' + task.id, task, 'context', false, $event)">
                                                <template x-if="task.context && task.context.trim() !== ''">
                                                    <div x-html="formatSubtaskText(task.context)"></div>
                                                </template>
                                                <template x-if="!task.context || task.context.trim() === ''">
                                                    <div class="inline-empty-placeholder context-placeholder">Sachkontext / Einleitungstext eingeben (optional)...</div>
                                                </template>
                                            </div>
                                        </template>
                                        <template x-if="activeInlineEditId === 'context-' + task.id">
                                            <div class="inline-editor-box" @click.stop>
                                                <textarea :id="'inline-context-' + task.id"
                                                          x-model="task.context"
                                                          @focus="selectCanvasItem(task, 'context'); activeTextareaTarget = task; activeTextareaId = 'inline-context-' + task.id; activeTextareaField = 'context'"
                                                          @input="autoResizeTextarea($el)"
                                                          @blur="handleInlineBlur('context-' + task.id)"
                                                          @keydown="handleInlineTextareaKeydown($event, task, 'task')"
                                                          @keydown.escape.stop="stopInlineEdit('context-' + task.id)"
                                                          @keydown.tab="if (! $event.shiftKey && task.subtasks && task.subtasks.length > 0) { $event.preventDefault(); selectCanvasItem(task, 'subtask', task.subtasks[0]); startInlineEdit('subtask-' + task.subtasks[0].id, 'inline-subtask-' + task.subtasks[0].id, task.subtasks[0], 'text'); }"
                                                          placeholder="Sachkontext / einleitenden Aufgabentext hier eingeben (Tab springt zur Aufgabenstellung)..."
                                                          class="inline-canvas-textarea"></textarea>
                                            </div>
                                        </template>
                                        
                                        <!-- Modules in Context (Task-Ebene) - NEU: dynamisch über modules[] -->
                                        <template x-for="module in (task.modules || [])" :key="module.id">
                                            <div>
                                                <!-- Zahlenstrahl -->
                                                <template x-if="module.type === 'zahlenstrahl'">
                                                    <div class="zahlenstrahl-container canvas-interactive-module"
                                                         :class="{ 'is-selected-module': selectedModuleId === module.id }"
                                                         @click.stop="selectModuleOnCanvas(module.id, task, 'context')"
                                                         title="Klicken, um Modul-Einstellungen rechts zu bearbeiten"
                                                         :style="'height: ' + (module.data.height || 2.5) + 'cm'"
                                                         x-html="renderZahlenstrahl(module.data)"></div>
                                                </template>
                                                <!-- Strahlensatz -->
                                                <template x-if="module.type === 'strahlensatz'">
                                                    <div class="strahlensatz-container canvas-interactive-module" :class="{ 'is-selected-module': selectedModuleId === module.id }" @click.stop="selectModuleOnCanvas(module.id, task, 'context')" title="Klicken, um Modul-Einstellungen rechts zu bearbeiten" :style="'height: ' + (module.data.height || 6.0) + 'cm'" x-html="renderStrahlensatz(module.data)"></div>
                                                </template>
                                                <!-- Glücksrad -->
                                                <template x-if="module.type === 'gluecksrad'">
                                                    <div class="gluecksrad-container canvas-interactive-module" :class="{ 'is-selected-module': selectedModuleId === module.id }" @click.stop="selectModuleOnCanvas(module.id, task, 'context')" title="Klicken, um Modul-Einstellungen rechts zu bearbeiten" :style="'height: ' + (module.data.height || 5.0) + 'cm'" x-html="renderGluecksrad(module.data)"></div>
                                                </template>
                                                <!-- Bruchteile (Bruch) -->
                                                <template x-if="module.type === 'bruch'">
                                                    <div class="bruch-render-wrapper atomic-block canvas-interactive-module"
                                                         :class="{ 'is-selected-module': selectedModuleId === module.id }"
                                                         @click.stop="selectModuleOnCanvas(module.id, task, 'context')"
                                                         title="Klicken, um Modul-Einstellungen rechts zu bearbeiten">
                                                        <div class="bruch-svg-container" :style="'height: ' + (module.data.height || 4.0) + 'cm; width: ' + (module.data.width || 4.0) + 'cm;'" x-html="renderBruch(module.data)"></div>
                                                        <template x-if="module.data.mode === 'determine'">
                                                            <div class="bruch-answer-box">
                                                                <div class="fraction-line-wrapper">
                                                                    <span class="fraction-placeholder">&nbsp;</span>
                                                                    <hr class="fraction-line">
                                                                    <span class="fraction-placeholder">&nbsp;</span>
                                                                </div>
                                                            </div>
                                                        </template>
                                                        <template x-if="module.data.mode === 'show' && module.data.showFractionText">
                                                            <div class="bruch-label-text" x-html="formatSubtaskText('$$\\frac{' + module.data.numerator + '}{' + module.data.denominator + '}$$')"></div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <!-- Diagramme (diagramm) -->
                                                <template x-if="module.type === 'diagramm'">
                                                    <div class="diag-render-wrapper atomic-block canvas-interactive-module" :class="{ 'is-selected-module': selectedModuleId === module.id }" @click.stop="selectModuleOnCanvas(module.id, task, 'context')" title="Klicken, um Modul-Einstellungen rechts zu bearbeiten">
                                                        <div class="diag-svg-container" :style="'height: ' + (module.data.height || 5.0) + 'cm; width: ' + (module.data.width || 10.0) + 'cm;'" x-html="renderDiagram(module.data)"></div>
                                                        <template x-if="module.data.mode === 'read'">
                                                            <div class="diag-answer-row">
                                                                <template x-for="item in module.data.items">
                                                                    <div class="diag-answer-item">
                                                                        <span class="diag-answer-label" x-text="item.label + ':'"></span>
                                                                        <span class="diag-answer-box-placeholder">&nbsp;</span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <!-- Koordinatensystem (koordinatensystem) -->
                                                <template x-if="module.type === 'koordinatensystem'">
                                                    <div class="koord-render-wrapper atomic-block canvas-interactive-module" :class="{ 'is-selected-module': selectedModuleId === module.id }" @click.stop="selectModuleOnCanvas(module.id, task, 'context')" title="Klicken, um Modul-Einstellungen rechts zu bearbeiten">
                                                        <div class="koord-svg-container" :style="'height: ' + (module.data.height || 6.0) + 'cm; width: ' + (module.data.width || 8.0) + 'cm;'" x-html="renderKoordinatensystem(module.data)"></div>
                                                        <template x-if="module.data.mode === 'read'">
                                                            <div class="koord-answer-row">
                                                                <template x-for="(pt, idx) in module.data.points" :key="idx">
                                                                    <div class="koord-answer-box">
                                                                        <span class="koord-answer-label" x-text="(pt.label || String.fromCharCode(65 + idx)) + ' = '"></span>
                                                                        <span class="koord-paren">(</span>
                                                                        <span class="koord-dotted-fill">&nbsp;&nbsp;&nbsp;&nbsp;</span>
                                                                        <span class="koord-divider">|</span>
                                                                        <span class="koord-dotted-fill">&nbsp;&nbsp;&nbsp;&nbsp;</span>
                                                                        <span class="koord-paren">)</span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <!-- Wertetabelle -->
                                                <template x-if="module.type === 'table'">
                                                    <table class="math-table canvas-interactive-module"
                                                           :class="{ 'is-selected-module': selectedModuleId === module.id }"
                                                           @click.stop="selectModuleOnCanvas(module.id, task, 'context')"
                                                           title="Klicken, um Modul-Einstellungen rechts zu bearbeiten">
                                                        <tr>
                                                            <th x-text="module.data.xValues"></th>
                                                            <template x-for="val in module.data.data[0]"><td x-text="val"></td></template>
                                                        </tr>
                                                        <tr>
                                                            <th x-text="module.data.yValues"></th>
                                                            <template x-for="val in module.data.data[1]"><td x-text="val"></td></template>
                                                        </tr>
                                                    </table>
                                                </template>
                                                <!-- 2D Geometrie -->
                                                <template x-if="module.type === 'geometry' || module.type === 'analysis_flaechen' || module.type === 'analysis_tangente' || module.type === 'analysis_kurve' || module.type === 'analysis_rotationskoerper' || module.type === 'analysis_extremwert' || module.type === 'analysis_riemann'">
                                                     <div :id="'jxgbox-' + task.id + '-' + module.id"
                                                          class="jxgbox math-board canvas-interactive-module"

                                                                    </template>

                                                                                <span x-show="cond.type === 'slope'">Der Graph hat an der Stelle <strong x-text="'x = ' + cond.x"></strong> die Steigung <strong x-text="'m = ' + cond.y"></strong>.</span>

                                                                    </ul>
                                                                </div>

                                                                <div :id="'jxgbox-' + subtask.id + '-' + module.id" class="jxgbox math-board" :style="'width:' + (module.data.settings.width || 10) + 'cm; height:' + (module.data.settings.height || 10) + 'cm;'" x-effect="module.data.code; JSON.stringify(module.data.settings); JSON.stringify(module.data.elements); renderBoard(subtask, 'jxgbox-' + subtask.id + '-' + module.id, module.data)"></div>
                                                            </template>

                                                        </div>
                                                    </template>

                                                    <!-- Ableitungspuzzle (Subtask Level) -->

                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </div>

                                                                                <td class="dreisatz-cell"><span x-show="module.data.printVisibility.data[ri][0]" x-text="row[0]"></span><span x-show="!module.data.printVisibility.data[ri][0]" class="dreisatz-blank"></span></td>
                                                                                <td class="dreisatz-cell"><span x-show="module.data.printVisibility.data[ri][1]" x-text="row[1]"></span><span x-show="!module.data.printVisibility.data[ri][1]" class="dreisatz-blank"></span></td>

                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </template>
                                                    </template>

                                                    <!-- Answer Space for Sub-Subtask with Drag-to-Resize -->
                                                    <template x-if="subSub.spaceType === 'karo'">
                                                        <div class="karo-papier resizable-space" :style="'height: ' + (subSub.spaceHeight || 5) + 'cm'">
                                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subSub)" title="Ziehen, um Höhe anzupassen">
                                                                <span class="resize-grip-lines"></span>
                                                                <span class="resize-height-badge" x-text="(subSub.spaceHeight || 5) + ' cm'"></span>
                                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subSub, 'none')" title="Schreibfeld ausblenden">✕</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template x-if="subSub.spaceType === 'linien'">
                                                        <div class="schreib-linien resizable-space" :style="'height: ' + (subSub.spaceHeight || 5) + 'cm'">
                                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subSub)" title="Ziehen, um Höhe anzupassen">
                                                                <span class="resize-grip-lines"></span>
                                                                <span class="resize-height-badge" x-text="(subSub.spaceHeight || 5) + ' cm'"></span>
                                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subSub, 'none')" title="Schreibfeld ausblenden">✕</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template x-if="subSub.spaceType === 'millimeter'">
                                                        <div class="millimeter-papier resizable-space" :style="'height: ' + (subSub.spaceHeight || 5) + 'cm'">
                                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subSub)" title="Ziehen, um Höhe anzupassen">
                                                                <span class="resize-grip-lines"></span>
                                                                <span class="resize-height-badge" x-text="(subSub.spaceHeight || 5) + ' cm'"></span>
                                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subSub, 'none')" title="Schreibfeld ausblenden">✕</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                    <template x-if="subtask.spaceType === 'karo'">
                                        <div class="karo-papier resizable-space" :style="'height: ' + (subtask.spaceHeight || 5) + 'cm'">
                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subtask)" title="Mit der Maus ziehen, um die Höhe anzupassen">
                                                <span class="resize-grip-lines"></span>
                                                <span class="resize-height-badge" x-text="(subtask.spaceHeight || 5) + ' cm'"></span>
                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subtask, 'none')" title="Karofeld ausblenden">✕</button>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="subtask.spaceType === 'linien'">
                                        <div class="schreib-linien resizable-space" :style="'height: ' + (subtask.spaceHeight || 5) + 'cm'">
                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subtask)" title="Mit der Maus ziehen, um die Höhe anzupassen">
                                                <span class="resize-grip-lines"></span>
                                                <span class="resize-height-badge" x-text="(subtask.spaceHeight || 5) + ' cm'"></span>
                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subtask, 'none')" title="Schreiblinien ausblenden">✕</button>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="subtask.spaceType === 'millimeter'">
                                        <div class="millimeter-papier resizable-space" :style="'height: ' + (subtask.spaceHeight || 5) + 'cm'">
                                            <div class="space-resize-handle" @mousedown="startSpaceResize($event, subtask)" title="Mit der Maus ziehen, um die Höhe anzupassen">
                                                <span class="resize-grip-lines"></span>
                                                <span class="resize-height-badge" x-text="(subtask.spaceHeight || 5) + ' cm'"></span>
                                                <button type="button" class="space-remove-btn" @mousedown.stop @click.stop="setSubtaskSpaceType(subtask, 'none')" title="Millimeterpapier ausblenden">✕</button>
                                            </div>
                                        </div>
                                    </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                </div>
            </template>
        </div>

            <!-- Empty State -->
            <template x-if="tasks.length === 0">
                <p class="empty-state-msg">Noch keine Aufgaben auf dem Arbeitsblatt.</p>
            </template>

            <!-- Direct Canvas Bottom Action Bar (Hidden in Print) -->
            <div class="canvas-bottom-add-bar">
                <button type="button" class="btn-canvas-add-task" @click="addTaskInline()">
                    + Neue Aufgabe
                </button>
                <button type="button" class="btn-canvas-add-section" @click="addSectionInline()">
                    + Neuer Abschnitt
                </button>
            </div>
        </article>
    </main>

    <!-- Right Inspector Sidebar: Clean Flat Inspector -->
    <aside class="inspector-sidebar">
        <!-- Empty state when no tasks exist -->
        <template x-if="!getSelectedTask()">
            <div class="inspector-empty-state">
                <p>Wähle eine Aufgabe auf dem Arbeitsblatt aus oder erstelle eine neue Aufgabe.</p>
            </div>
        </template>

        <!-- SECTION SELECTED -->
        <template x-if="getSelectedTask() && getSelectedTask().type === 'section'">
            <div class="inspector-flat-wrap">
                <header class="inspector-top-bar">
                    <div class="inspector-top-row-main">
                        <strong class="inspector-task-heading">Abschnitt</strong>
                    </div>
                </header>

                <div class="inspector-body">
                    <div class="insp-section">
                        <div class="insp-field">
                            <label>Titel</label>
                            <input type="text" x-model="getSelectedTask().title" @input="autoSave(); calculatePagination()" class="insp-text-input" placeholder="z.B. Teil A">
                        </div>
                        <div class="insp-field">
                            <label>Untertitel</label>
                            <input type="text" x-model="getSelectedTask().subtitle" @input="autoSave(); calculatePagination()" class="insp-text-input" placeholder="Optional">
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- TASK SELECTED: MODULE INSPECTOR PANEL (When an inline-supported module is selected) -->
        <template x-if="getSelectedTask() && getSelectedTask().type !== 'section' && getSelectedModule() && isInlineInspectorModule(getSelectedModule().type)">
            <div class="inspector-flat-wrap inspector-module-wrap" x-data="{ get mod() { return getSelectedModule(); }, get d() { return getSelectedModule().data; } }">
                <!-- 1. MODULE TOP HEADER BAR -->
                <header class="inspector-top-bar inspector-module-top-bar">
                    <div class="inspector-top-row-sub">
                        <button type="button" class="insp-back-btn" @click="closeInspectorModule()">
                            ← Zurück zu <span x-text="'Aufgabe ' + getTaskNumber(getSelectedTask().id)"></span>
                        </button>
                    </div>
                    <div class="inspector-top-row-main">
                        <strong class="inspector-task-heading" x-text="getModuleDisplayName(mod.type)"></strong>
                        <button type="button"
                                class="insp-mod-header-del"
                                @click="removeModuleById(getActiveModuleHolder(), mod.id); autoSave(); calculatePagination()"
                                title="Modul aus Aufgabe entfernen">Löschen</button>
                    </div>
                </header>

                <!-- ========================================================= -->
                <!-- A) FUNKTIONSPLOTTER (analysis_kurve)                      -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'analysis_kurve'">
                <div class="inspector-body">
                    <!-- 1. MODUS & VORLAGEN -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Modus & Vorlagen</span>
                        </div>

                        <div class="insp-field">
                            <label>Darstellungs-Modus</label>
                            <select x-model="d.mode" @change="updateKurveCode(d); autoSave()" class="insp-select">
                                <option value="kurve">Kurvendiskussion (N, HP/TP, WP, f')</option>
                                <option value="plot">Einfacher Funktionsplot (f &amp; g)</option>
                                <option value="parabel">Parabel (Scheitelpunkt / Allg. Form)</option>
                                <option value="tangente">Tangente &amp; Steigungsdreieck</option>
                                <option value="integral">Flächenberechnung (Integral)</option>
                            </select>
                        </div>

                        <div class="insp-field" x-show="d.mode !== 'parabel'">
                            <label>Schnell-Vorlage („Schöne Funktion“)</label>
                            <select @change="applyKurvePreset(d, $event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">
                                <option value="" selected disabled>✨ Vorlage wählen…</option>
                                <option value="kubisch_sym">3. Grades punktsymm.: 0,25x³ − 0,75x</option>
                                <option value="kubisch_allg">3. Grades glatte EP: −x³ + 3x²</option>
                                <option value="grad4_w">4. Grades W-Form: 0,25x⁴ − 2x²</option>
                                <option value="parabel_normal">Parabel mit glatten N: x² − 2x − 3</option>
                                <option value="exp_wachstum">e-Funktion: 2x · e^(−0,5x)</option>
                                <option value="trigo_sin">Trigonometrisch: 2 · sin(x)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 2. FUNKTIONSGLEICHUNG & ELEMENTE -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Funktion &amp; Merkmale</span>
                        </div>

                        <!-- Standard Funktionsgleichung f(x) (für alle außer Parabel) -->
                        <template x-if="d.mode !== 'parabel'">
                            <div class="insp-func-group">
                                <div class="insp-func-input-row">
                                    <div class="insp-func-name-col">
                                        <label>Name</label>
                                        <input type="text" x-model="d.functionName" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center" placeholder="f">
                                    </div>
                                    <div class="insp-func-expr-col">
                                        <label x-text="(d.functionName || 'f') + '(x) ='"></label>
                                        <input type="text" x-model="d.formula" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-mono" placeholder="z.B. 0.2*x^3 - 1.2*x">
                                    </div>
                                </div>
                                <span class="insp-field-hint">Tipp: Malzeichen als <code>*</code>, Potenz als <code>^</code>, Komma als <code>.</code></span>
                            </div>
                        </template>

                        <!-- MODUS: Kurvendiskussion Check-Chips -->
                        <template x-if="d.mode === 'kurve' || !d.mode">
                            <div class="insp-chips-section">
                                <span class="insp-sub-label">Punkte &amp; Ableitungen im Graphen:</span>
                                <div class="insp-chip-grid">
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showNullstellen }" @click="d.showNullstellen = !d.showNullstellen; updateKurveCode(d); autoSave()">
                                        <span class="chip-dot dot-green"></span> Nullstellen (N)
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showExtrema }" @click="d.showExtrema = !d.showExtrema; updateKurveCode(d); autoSave()">
                                        <span class="chip-dot dot-red"></span> Extrema (HP/TP)
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showWendepunkte }" @click="d.showWendepunkte = !d.showWendepunkte; updateKurveCode(d); autoSave()">
                                        <span class="chip-dot dot-blue"></span> Wendepunkte (WP)
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showDeriv1 }" @click="d.showDeriv1 = !d.showDeriv1; updateKurveCode(d); autoSave()">
                                        1. Ableitung f'(x)
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showDeriv2 }" @click="d.showDeriv2 = !d.showDeriv2; updateKurveCode(d); autoSave()">
                                        2. Ableitung f''(x)
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- MODUS: Einfacher Plot -->
                        <template x-if="d.mode === 'plot'">
                            <div class="insp-sub-block">
                                <label class="insp-check-row">
                                    <input type="checkbox" x-model="d.enableG" @change="updateKurveCode(d); autoSave()">
                                    <span>Zweite Funktion g(x) einzeichnen</span>
                                </label>
                                <template x-if="d.enableG">
                                    <div class="insp-func-input-row margin-top-xs">
                                        <div class="insp-func-name-col">
                                            <label>Name</label>
                                            <input type="text" x-model="d.functionName2" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center" placeholder="g">
                                        </div>
                                        <div class="insp-func-expr-col">
                                            <label x-text="(d.functionName2 || 'g') + '(x) ='"></label>
                                            <input type="text" x-model="d.formula2" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-mono" placeholder="z.B. x - 1">
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- MODUS: Parabel -->
                        <template x-if="d.mode === 'parabel'">
                            <div class="insp-sub-block">
                                <div class="insp-func-input-row">
                                    <div class="insp-func-name-col">
                                        <label>Name</label>
                                        <input type="text" x-model="d.functionName" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center" placeholder="f">
                                    </div>
                                    <div class="insp-func-expr-col">
                                        <label>Darstellungsform</label>
                                        <select x-model="d.parabolaForm" @change="updateKurveCode(d); autoSave()" class="insp-select">
                                            <option value="vertex">a(x − d)² + e (Scheitelp.)</option>
                                            <option value="general">ax² + bx + c (Allgemein)</option>
                                        </select>
                                    </div>
                                </div>

                                <template x-if="d.parabolaForm !== 'general'">
                                    <div class="insp-3col-grid">
                                        <div class="insp-field">
                                            <label>Streckung a</label>
                                            <input type="number" step="0.25" x-model="d.parabolaA" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                        <div class="insp-field">
                                            <label>x-Scheitel d</label>
                                            <input type="number" step="0.5" x-model="d.parabolaD" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                        <div class="insp-field">
                                            <label>y-Scheitel e</label>
                                            <input type="number" step="0.5" x-model="d.parabolaE" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                    </div>
                                </template>

                                <template x-if="d.parabolaForm === 'general'">
                                    <div class="insp-3col-grid">
                                        <div class="insp-field">
                                            <label>Faktor a</label>
                                            <input type="number" step="0.25" x-model="d.parabolaA" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                        <div class="insp-field">
                                            <label>Faktor b</label>
                                            <input type="number" step="0.5" x-model="d.parabolaB" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                        <div class="insp-field">
                                            <label>Abschnitt c</label>
                                            <input type="number" step="0.5" x-model="d.parabolaC" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                        </div>
                                    </div>
                                </template>

                                <div class="insp-chip-grid margin-top-xs">
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showVertex }" @click="d.showVertex = !d.showVertex; updateKurveCode(d); autoSave()">
                                        Scheitelpunkt S
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showSymmetryAxis }" @click="d.showSymmetryAxis = !d.showSymmetryAxis; updateKurveCode(d); autoSave()">
                                        Symmetrieachse
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- MODUS: Tangente -->
                        <template x-if="d.mode === 'tangente'">
                            <div class="insp-sub-block">
                                <div class="insp-kv-row">
                                    <span class="insp-kv-label">Berührstelle x₀</span>
                                    <input type="number" step="0.5" x-model="d.tangentX" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-short">
                                </div>
                                <div class="insp-chip-grid margin-top-xs">
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showTangent }" @click="d.showTangent = !d.showTangent; updateKurveCode(d); autoSave()">
                                        Tangente zeigen
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showSlopeTriangle }" @click="d.showSlopeTriangle = !d.showSlopeTriangle; updateKurveCode(d); autoSave()">
                                        Steigungsdreieck
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- MODUS: Integral -->
                        <template x-if="d.mode === 'integral'">
                            <div class="insp-sub-block">
                                <div class="insp-2col-grid">
                                    <div class="insp-field">
                                        <label>Untere Grenze a</label>
                                        <input type="number" step="0.5" x-model="d.xStart" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                    <div class="insp-field">
                                        <label>Obere Grenze b</label>
                                        <input type="number" step="0.5" x-model="d.xEnd" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                </div>

                                <label class="insp-check-row margin-top-xs">
                                    <input type="checkbox" x-model="d.enableG" @change="updateKurveCode(d); autoSave()">
                                    <span>Fläche zwischen 2 Funktionen</span>
                                </label>

                                <template x-if="d.enableG">
                                    <div class="insp-func-input-row margin-top-xs">
                                        <div class="insp-func-name-col">
                                            <label>Name</label>
                                            <input type="text" x-model="d.functionName2" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center" placeholder="g">
                                        </div>
                                        <div class="insp-func-expr-col">
                                            <label x-text="(d.functionName2 || 'g') + '(x) ='"></label>
                                            <input type="text" x-model="d.formula2" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-mono" placeholder="z.B. x - 1">
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- 3. KOORDINATENSYSTEM & AUSSCHNITT -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Koordinatensystem</span>
                            <button type="button" class="insp-mini-action-btn" @click="autoFitKurveBounds(d, 'analysis_kurve')" title="y-Achse automatisch an den Funktionsverlauf anpassen">
                                🎯 Auto-Y
                            </button>
                        </div>

                        <div class="insp-chip-grid">
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.settings.axis }" @click="d.settings.axis = !d.settings.axis; autoSave()">
                                Achsen anzeigen
                            </button>
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.settings.grid }" @click="d.settings.grid = !d.settings.grid; autoSave()">
                                Gitter anzeigen
                            </button>
                        </div>

                        <div class="insp-bounds-grid">
                            <div class="insp-field">
                                <label>x von</label>
                                <input type="number" step="1" x-model.number="d.settings.xMin" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>x bis</label>
                                <input type="number" step="1" x-model.number="d.settings.xMax" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>y von</label>
                                <input type="number" step="1" x-model.number="d.settings.yMin" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>y bis</label>
                                <input type="number" step="1" x-model.number="d.settings.yMax" @input="updateKurveCode(d); autoSave()" class="insp-text-input insp-input-center">
                            </div>
                        </div>
                    </div>

                    <!-- 4. DRUCKGRÖSSE AUF DEM BLATT -->
                    <div class="insp-section insp-section-layout">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckgröße (A4)</span>
                            <div class="insp-seg-compact insp-seg-layout">
                                <button type="button" :class="{ 'active': d.settings.width == 7 && d.settings.height == 6 }" @click="setKurveSizePreset(d, 'S')" title="Kompakt (7×6 cm)">S</button>
                                <button type="button" :class="{ 'active': d.settings.width == 10 && d.settings.height == 8 }" @click="setKurveSizePreset(d, 'M')" title="Mittel (10×8 cm)">M</button>
                                <button type="button" :class="{ 'active': d.settings.width == 14 && d.settings.height == 10 }" @click="setKurveSizePreset(d, 'L')" title="Groß (14×10 cm)">L</button>
                            </div>
                        </div>

                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Breite (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', -0.5)">−</button>
                                <input type="number" step="0.5" min="5" max="17" x-model.number="d.settings.width" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', 0.5)">+</button>
                            </div>
                        </div>

                        <div class="insp-kv-row">
