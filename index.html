                                        <span class="insp-cond-num" x-text="(cIdx + 1) + '.'"></span>
                                        <select x-model="cond.type"
                                                @change="if(cond.type === 'yIntercept') cond.x = '0'; updateSteckbriefCode(d); autoSave(); calculatePagination()"
                                                class="insp-select insp-cond-select">
                                            <option value="point">Punkt P(x | y)</option>
                                            <option value="extreme">Extrempunkt E(x | y)</option>
                                            <option value="inflection">Wendepunkt W(x | y)</option>
                                            <option value="saddle">Sattelpunkt S(x | y)</option>
                                            <option value="slope">Steigung m bei x</option>
                                            <option value="yIntercept">y-Achsenabschnitt y₀</option>
                                            <option value="curvature">Krümmung f''(x)</option>
                                        </select>
                                        <button type="button" class="insp-mod-del" @click="removeSteckbriefCondition(d, cIdx)" title="Bedingung entfernen">×</button>
                                    </div>
                                    <div class="insp-cond-inputs">
                                        <template x-if="cond.type !== 'yIntercept'">
                                            <div class="insp-cond-coord">
                                                <span>x =</span>
                                                <input type="text" x-model="cond.x" @input="updateSteckbriefCode(d); autoSave(); calculatePagination()" class="insp-text-input insp-input-center" placeholder="0">
                                            </div>
                                        </template>
                                        <div class="insp-cond-coord">
                                            <span x-text="cond.type === 'slope' ? 'm =' : (cond.type === 'yIntercept' ? 'y₀ =' : (cond.type === 'curvature' ? 'f\'\' =' : 'y ='))"></span>
                                            <input type="text" x-model="cond.y" @input="updateSteckbriefCode(d); autoSave(); calculatePagination()" class="insp-text-input insp-input-center" :placeholder="['extreme','inflection','saddle'].includes(cond.type) ? 'opt.' : '0'">
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Live LGS-Solver Badge -->
                        <div class="insp-solver-badge"
                             :class="{
                                 'is-solved': sol.status === 'solved',
                                 'is-warn': sol.status === 'underdetermined',
                                 'is-err': sol.status === 'contradictory' || sol.status === 'error'
                             }">
                            <div class="solver-badge-row">
                                <span class="solver-badge-label" x-text="sol.status === 'solved' ? '✓ Eindeutig lösbar:' : '⚠ Hinweis:'"></span>
                                <template x-if="sol.equationsText && sol.equationsText.length > 0">
                                    <button type="button" class="solver-lgs-toggle" @click="showLgs = !showLgs" x-text="showLgs ? 'LGS ▲' : 'LGS ▼'"></button>
                                </template>
                            </div>
                            <template x-if="sol.status === 'solved'">
                                <div class="solver-formula-out" x-html="formatSubtaskText('$$' + sol.formulaDisplay + '$$')"></div>
                            </template>
                            <template x-if="sol.status !== 'solved'">
                                <strong class="solver-badge-val" x-text="sol.errorMessage"></strong>
                            </template>
                            <template x-if="showLgs && sol.lgsStepsText && sol.lgsStepsText.length > 0">
                                <div class="solver-lgs-details">
                                    <template x-for="(step, sIdx) in sol.lgsStepsText" :key="sIdx">
                                        <div x-html="formatSubtaskText('$' + step + '$')"></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 3. ANZEIGE AUF DEM BLATT & KOORDINATENSYSTEM -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Abdruck auf dem Arbeitsblatt</span>
                            <template x-if="d.showGraph">
                                <button type="button" class="insp-mini-action-btn" @click="autoFitKurveBounds(d, 'analysis_steckbrief')" title="y-Achse automatisch anpassen">
                                    🎯 Auto-Y
                                </button>
                            </template>
                        </div>

                        <div class="insp-chip-grid">
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showTextual }" @click="d.showTextual = !d.showTextual; autoSave(); calculatePagination()">
                                <span class="chip-dot dot-blue"></span> Bedingungen als Text
                            </button>
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showGraph }" @click="d.showGraph = !d.showGraph; autoSave(); calculatePagination()">
                                <span class="chip-dot dot-green"></span> Funktionsgraph
                            </button>
                        </div>

                        <template x-if="d.showGraph">
                            <div class="insp-sub-block margin-top-xs">
                                <div class="insp-chip-grid">
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.settings.axis }" @click="d.settings.axis = !d.settings.axis; autoSave()">
                                        Achsen anzeigen
                                    </button>
                                    <button type="button" class="insp-toggle-chip" :class="{ 'active': d.settings.grid }" @click="d.settings.grid = !d.settings.grid; autoSave()">
                                        Gitter anzeigen
                                    </button>
                                </div>

                                <div class="insp-bounds-grid margin-top-xs">
                                    <div class="insp-field">
                                        <label>x von</label>
                                        <input type="number" step="1" x-model.number="d.settings.xMin" @input="updateSteckbriefCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                    <div class="insp-field">
                                        <label>x bis</label>
                                        <input type="number" step="1" x-model.number="d.settings.xMax" @input="updateSteckbriefCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                    <div class="insp-field">
                                        <label>y von</label>
                                        <input type="number" step="1" x-model.number="d.settings.yMin" @input="updateSteckbriefCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                    <div class="insp-field">
                                        <label>y bis</label>
                                        <input type="number" step="1" x-model.number="d.settings.yMax" @input="updateSteckbriefCode(d); autoSave()" class="insp-text-input insp-input-center">
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 4. DRUCKGRÖSSE GRAPH -->
                    <template x-if="d.showGraph">
                        <div class="insp-section insp-section-layout">
                            <div class="insp-section-header">
                                <span class="insp-section-label">Graphgröße (A4)</span>
                                <div class="insp-seg-compact insp-seg-layout">
                                    <button type="button" :class="{ 'active': d.settings.width == 7 && d.settings.height == 6 }" @click="setKurveSizePreset(d, 'S')">S</button>
                                    <button type="button" :class="{ 'active': d.settings.width == 10 && d.settings.height == 8 }" @click="setKurveSizePreset(d, 'M')">M</button>
                                    <button type="button" :class="{ 'active': d.settings.width == 14 && d.settings.height == 10 }" @click="setKurveSizePreset(d, 'L')">L</button>
                                </div>
                            </div>
                            <div class="insp-kv-row">
                                <span class="insp-kv-label">Breite (cm)</span>
                                <div class="insp-stepper">
                                    <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', -0.5)">−</button>
                                    <input type="number" step="0.5" min="5" max="17" x-model.number="d.settings.width" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                    <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', 0.5)">+</button>
                                </div>
                            </div>
                            <div class="insp-kv-row">
                                <span class="insp-kv-label">Höhe (cm)</span>
                                <div class="insp-stepper">
                                    <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'height', -0.5)">−</button>
                                    <input type="number" step="0.5" min="3" max="15" x-model.number="d.settings.height" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                    <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'height', 0.5)">+</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- F) ABLEITUNGSPUZZLE (analysis_puzzle)                     -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'analysis_puzzle'">
                <div class="inspector-body">
                    <!-- 1. MODUS & SPALTEN-DARSTELLUNG -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Zuordnungs-Modus</span>
                        </div>

                        <div class="insp-field">
                            <label>Aufgabentyp</label>
                            <select x-model="d.mode" @change="updatePuzzleCode(d, getActiveModuleHolder()); autoSave(); calculatePagination()" class="insp-select">
                                <option value="derivative">Ableitungspuzzle: f(x) ↔ f'(x)</option>
                                <option value="graph_to_equation">Funktionsgraphen ↔ Gleichungen</option>
                            </select>
                        </div>

                        <template x-if="d.mode === 'derivative' || !d.mode">
                            <div class="insp-2col-grid">
                                <div class="insp-field">
                                    <label>Links (I, II, III): f(x)</label>
                                    <select x-model="d.typeF" @change="updatePuzzleCode(d, getActiveModuleHolder()); autoSave(); calculatePagination()" class="insp-select">
                                        <option value="graph">Als Graph</option>
                                        <option value="equation">Als Gleichung</option>
                                    </select>
                                </div>
                                <div class="insp-field">
                                    <label>Rechts (A, B, C): f'(x)</label>
                                    <select x-model="d.typeFPrime" @change="updatePuzzleCode(d, getActiveModuleHolder()); autoSave(); calculatePagination()" class="insp-select">
                                        <option value="graph">Als Graph</option>
                                        <option value="equation">Als Gleichung</option>
                                    </select>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 2. FUNKTIONEN & MISCHEN -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Funktionen (I, II, III…)</span>
                            <div style="display: flex; gap: 4px;">
                                <button type="button" class="insp-mini-action-btn" @click="reshufflePuzzle(d)" title="Reihenfolge von A, B, C neu würfeln">🎲 Mischen</button>
                                <template x-if="d.functions.length < 6">
                                    <button type="button" class="insp-mini-action-btn" @click="addPuzzleFunction(d)" title="Weitere Funktion hinzufügen">+ Neu</button>
                                </template>
                            </div>
                        </div>

                        <div class="insp-cond-list">
                            <template x-for="(fn, fIdx) in d.functions" :key="fn.id">
                                <div class="insp-cond-card">
                                    <div class="insp-cond-top">
                                        <span class="insp-cond-num" x-text="romanize(fIdx + 1)"></span>
                                        <input type="text"
                                               x-model="fn.expr"
                                               @input="updatePuzzleCode(d, getActiveModuleHolder()); autoSave()"
                                               class="insp-text-input insp-input-mono"
                                               style="flex: 1;"
                                               placeholder="z.B. x^3 - 3*x">
                                        <button type="button"
                                                class="insp-mod-del"
                                                x-show="d.functions.length > 2"
                                                @click="removePuzzleFunction(d, fIdx)"
                                                title="Funktion entfernen">×</button>
                                    </div>
                                    <template x-if="d.mode !== 'graph_to_equation'">
                                        <div class="insp-puzzle-deriv-hint">
                                            <span>f'(x) =</span>
                                            <code x-text="fn.exprFPrime || '…'"></code>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 3. ANTWORTTABELLE & BEGRÜNDUNG -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Begründung &amp; Ausschnitt</span>
                        </div>

                        <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showJustification }" @click="d.showJustification = !d.showJustification; autoSave(); calculatePagination()">
                            <span class="chip-dot dot-blue"></span> Begründungsfeld unter Tabelle drucken
                        </button>

                        <template x-if="d.showJustification">
                            <div class="insp-sub-block margin-top-xs">
                                <div class="insp-seg-bar insp-seg-space">
                                    <button type="button" :class="{ 'active': !d.justificationInTable }" @click="d.justificationInTable = false; autoSave(); calculatePagination()">
                                        Linien darunter
                                    </button>
                                    <button type="button" :class="{ 'active': d.justificationInTable }" @click="d.justificationInTable = true; autoSave(); calculatePagination()">
                                        Direkt in Tabelle
                                    </button>
                                </div>
                                <div class="insp-kv-row margin-top-xs">
                                    <span class="insp-kv-label">Höhe (cm)</span>
                                    <div class="insp-stepper">
                                        <button type="button" class="insp-step-btn" @click="adjustJustificationHeight(d, -0.5)">−</button>
                                        <input type="number" step="0.5" min="1.5" max="12" x-model.number="d.justificationHeight" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                        <button type="button" class="insp-step-btn" @click="adjustJustificationHeight(d, 0.5)">+</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div class="insp-bounds-grid margin-top-xs">
                            <div class="insp-field">
                                <label>x von</label>
                                <input type="number" step="1" x-model.number="d.settings.xMin" @input="autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>x bis</label>
                                <input type="number" step="1" x-model.number="d.settings.xMax" @input="autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>y von</label>
                                <input type="number" step="1" x-model.number="d.settings.yMin" @input="autoSave()" class="insp-text-input insp-input-center">
                            </div>
                            <div class="insp-field">
                                <label>y bis</label>
                                <input type="number" step="1" x-model.number="d.settings.yMax" @input="autoSave()" class="insp-text-input insp-input-center">
                            </div>
                        </div>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- G) WERTETABELLE (table)                                   -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'table'">
                <div class="inspector-body">
                    <!-- 1. ZEILENBESCHRIFTUNG & AUTO-FILL FORMEL -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Kopfzeilen &amp; Auto-Formel</span>
                        </div>

                        <div class="insp-2col-grid">
                            <div class="insp-field">
                                <label>1. Zeile (z.B. x)</label>
                                <input type="text" x-model="d.xValues" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="x">
                            </div>
                            <div class="insp-field">
                                <label>2. Zeile (z.B. f(x))</label>
                                <input type="text" x-model="d.yValues" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="f(x)">
                            </div>
                        </div>

                        <div class="insp-field">
                            <label>Funktion zum automatischen Berechnen</label>
                            <input type="text" x-model="d.formula" @keydown.enter.prevent="autofillTable(d)" class="insp-text-input insp-input-mono" placeholder="z.B. x^2 - 2*x">
                        </div>

                        <div class="insp-tool-grid">
                            <button type="button" class="insp-action-btn insp-btn-module" @click="autofillTable(d)" title="2. Zeile anhand der Formel ausfüllen">
                                ✨ Berechnen
                            </button>
                            <button type="button" class="insp-action-btn insp-btn-formula" @click="clearTableYValues(d)" title="2. Zeile leeren (Schüler füllen aus)">
                                🧹 y-Zeile leeren
                            </button>
                        </div>
                    </div>

                    <!-- 2. SPALTEN & WERTEPAARE -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label" x-text="'Spaltenwerte (' + d.data[0].length + ')'"></span>
                            <div style="display: flex; gap: 4px;">
                                <button type="button" class="insp-mini-action-btn" @click="removeColumn(d)" :disabled="d.data[0].length <= 1" title="Letzte Spalte entfernen">− Spalte</button>
                                <button type="button" class="insp-mini-action-btn" @click="addColumn(d)" title="Spalte anhängen">+ Spalte</button>
                            </div>
                        </div>

                        <div class="insp-table-pairs-header">
                            <span class="pair-col-idx">#</span>
                            <span class="pair-col-lbl" x-text="d.xValues || 'x'"></span>
                            <span class="pair-col-lbl" x-text="d.yValues || 'f(x)'"></span>
                        </div>

                        <div class="insp-cond-list">
                            <template x-for="(xVal, colIdx) in d.data[0]" :key="colIdx">
                                <div class="insp-table-pair-row">
                                    <span class="insp-cond-num" x-text="(colIdx + 1) + '.'"></span>
                                    <input type="text"
                                           x-model="d.data[0][colIdx]"
                                           @input="autoSave()"
                                           class="insp-text-input insp-input-center"
                                           placeholder="x-Wert">
                                    <input type="text"
                                           x-model="d.data[1][colIdx]"
                                           @input="autoSave()"
                                           class="insp-text-input insp-input-center"
                                           placeholder="leer (Schüler)">
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- H) LINEARES GLEICHUNGSSYSTEM (lgs)                        -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'lgs'">
                <div class="inspector-body">
                    <!-- 1. DIMENSION, VARIABLEN & MODUS -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">System-Typ &amp; Variablen</span>
                        </div>

                        <div class="insp-2col-grid">
                            <div class="insp-field">
                                <label>Größe (Dimension)</label>
                                <select x-model.number="d.dimension" @change="onLgsDimensionChange(d); calculatePagination()" class="insp-select">
                                    <option :value="2">2×2 System</option>
                                    <option :value="3">3×3 System</option>
                                </select>
                            </div>
                            <div class="insp-field">
                                <label>Variablennamen</label>
                                <input type="text" x-model="d.variablesRaw" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="x, y">
                            </div>
                        </div>

                        <div class="insp-seg-bar insp-seg-space">
                            <button type="button" :class="{ 'active': d.mode === 'generate' }" @click="d.mode = 'generate'; autoSave(); calculatePagination()">
                                🎲 Auto-Generator
                            </button>
                            <button type="button" :class="{ 'active': d.mode === 'manual' }" @click="d.mode = 'manual'; autoSave(); calculatePagination()">
                                ✍️ Manuell eingeben
                            </button>
                        </div>
                    </div>

                    <!-- 2A. MODUS: AUTO-GENERATOR -->
                    <template x-if="d.mode === 'generate'">
                        <div class="insp-section insp-section-modules">
                            <div class="insp-section-header">
                                <span class="insp-section-label">Wunschlösungen (ganzzahlig)</span>
                                <button type="button" class="insp-mini-action-btn" @click="generateLGS(d)">🎲 Neu würfeln</button>
                            </div>

                            <span class="insp-field-hint">Gib die gewünschte Lösung vor – das System würfelt automatisch ein eindeutig lösbares Gleichungssystem.</span>

                            <div :class="d.dimension === 3 ? 'insp-3col-grid' : 'insp-2col-grid'">
                                <template x-for="(sol, idx) in Array.from({ length: d.dimension })" :key="idx">
                                    <div class="insp-field">
                                        <label x-text="((d.variablesRaw || '').split(',')[idx]?.trim() || ['x','y','z'][idx]) + ' ='"></label>
                                        <input type="number" step="1" x-model="d.targetSolutions[idx]" @input="generateLGS(d)" class="insp-text-input insp-input-center">
                                    </div>
                                </template>
                            </div>

                            <button type="button" class="insp-action-btn insp-btn-module insp-btn-full" @click="generateLGS(d)">
                                🎲 Andere Koeffizienten würfeln
                            </button>
                        </div>
                    </template>

                    <!-- 2B. MODUS: MANUELLE KOEFFIZIENTEN -->
                    <template x-if="d.mode === 'manual'">
                        <div class="insp-section insp-section-modules">
                            <div class="insp-section-header">
                                <span class="insp-section-label">Koeffizienten eintragen</span>
                            </div>

                            <div class="insp-cond-list">
                                <template x-for="(row, rIdx) in Array.from({ length: d.dimension })" :key="rIdx">
                                    <div class="insp-cond-card">
                                        <div class="insp-lgs-manual-row">
                                            <span class="insp-cond-num" x-text="['I', 'II', 'III'][rIdx]"></span>
                                            <input type="text" x-model="d.manualCoefficients[rIdx][0]" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="a">
                                            <span class="lgs-var-lbl" x-text="((d.variablesRaw || '').split(',')[0]?.trim() || 'x') + ' +'"></span>
                                            <input type="text" x-model="d.manualCoefficients[rIdx][1]" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="b">
                                            <span class="lgs-var-lbl" x-text="((d.variablesRaw || '').split(',')[1]?.trim() || 'y') + (d.dimension === 3 ? ' +' : ' =')"></span>
                                            <template x-if="d.dimension === 3">
                                                <div style="display: contents;">
                                                    <input type="text" x-model="d.manualCoefficients[rIdx][2]" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="c">
                                                    <span class="lgs-var-lbl" x-text="((d.variablesRaw || '').split(',')[2]?.trim() || 'z') + ' ='"></span>
                                                </div>
                                            </template>
                                            <input type="text" x-model="d.manualCoefficients[rIdx][d.dimension]" @input="autoSave()" class="insp-text-input insp-input-center" placeholder="d">
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- I) DREISATZ (dreisatz)                                    -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'dreisatz'">
                <div class="inspector-body">
                    <!-- 1. ZUORDNUNGSTYP & SPALTENÜBERSCHRIFTEN -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Zuordnung &amp; Überschriften</span>
                        </div>

                        <div class="insp-seg-bar insp-seg-space">
                            <button type="button" :class="{ 'active': d.type === 'proportional' || !d.type }" @click="d.type = 'proportional'; autofillDreisatz(d); autoSave()">
                                Proportional
                            </button>

                <template x-if="mod.type === 'zahlenstrahl'">

                                            <div class="insp-coord-row cols-2"><span class="insp-coord-lbl">P₂</span><input type="number" step="0.5" x-model.number="el.p2.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.p2.y" class="insp-text-input insp-input-center" placeholder="y"></div>

                                    </template>

                                            <div class="insp-coord-row cols-2"><span class="insp-coord-lbl">P₁</span><input type="number" step="0.5" x-model.number="el.p1.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.p1.y" class="insp-text-input insp-input-center" placeholder="y"></div>
                                            <div class="insp-coord-row cols-2"><span class="insp-coord-lbl">P₂</span><input type="number" step="0.5" x-model.number="el.p2.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.p2.y" class="insp-text-input insp-input-center" placeholder="y"></div>

                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Text -->
                                    <template x-if="el.type === 'text'">

                                        </div>
                                    </template>

                                    <!-- Kreis -->
                                    <template x-if="el.type === 'circle'">
                                        <div>
                                            <div class="insp-coord-row cols-2"><span class="insp-coord-lbl">Mitte</span><input type="number" step="0.5" x-model.number="el.center.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.center.y" class="insp-text-input insp-input-center" placeholder="y"></div>
                                            <div class="insp-coord-row cols-1"><span class="insp-coord-lbl">Radius</span><input type="number" step="0.5" min="0" x-model.number="el.radius" class="insp-text-input insp-input-center"></div>
                                            <label class="insp-check-row"><input type="checkbox" x-model="el.showCenter"><span>Mittelpunkt zeigen</span></label>
                                        </div>
                                    </template>

                                    <!-- Vieleck -->
                                    <template x-if="el.type === 'polygon'">
                                        <div>
                                            <template x-for="(v, vIdx) in el.vertices" :key="vIdx">

                                                    <span class="insp-coord-lbl" x-text="'Ecke ' + (vIdx + 1)"></span>

                                            <label class="insp-check-row"><input type="checkbox" x-model="el.showEdges"><span>Kanten beschriften</span></label>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 3. KOORDINATENSYSTEM -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Koordinatensystem</span>
                        </div>

                                <option value="vier">Vier Quadranten (−5 bis 5)</option>

                                    <template x-if="el.type === 'cuboid3d'">
                                        <div>
                                            <div class="insp-coord-row"><span class="insp-coord-lbl">Ecke</span><input type="number" step="0.5" x-model.number="el.p.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.p.y" class="insp-text-input insp-input-center" placeholder="y"><input type="number" step="0.5" x-model.number="el.p.z" class="insp-text-input insp-input-center" placeholder="z"></div>
                                            <div class="insp-coord-row"><span class="insp-coord-lbl">B/T/H</span><input type="number" step="0.5" min="0" x-model.number="el.w" class="insp-text-input insp-input-center" placeholder="B"><input type="number" step="0.5" min="0" x-model.number="el.d" class="insp-text-input insp-input-center" placeholder="T"><input type="number" step="0.5" min="0" x-model.number="el.h" class="insp-text-input insp-input-center" placeholder="H"></div>
                                            <div class="insp-coord-row cols-1"><span class="insp-coord-lbl">Füllung</span><input type="number" step="0.1" min="0" max="1" x-model.number="el.fillOpacity" class="insp-text-input insp-input-center"></div>
                                            <label class="insp-check-row"><input type="checkbox" x-model="el.showVertices"><span>Eckpunkte zeigen</span></label>
                                        </div>
                                    </template>

                                    <template x-if="el.type === 'pyramid3d'">
                                        <div>
                                            <div class="insp-coord-row"><span class="insp-coord-lbl">Basis-M.</span><input type="number" step="0.5" x-model.number="el.center.x" class="insp-text-input insp-input-center" placeholder="x"><input type="number" step="0.5" x-model.number="el.center.y" class="insp-text-input insp-input-center" placeholder="y"><input type="number" step="0.5" x-model.number="el.center.z" class="insp-text-input insp-input-center" placeholder="z"></div>
                                            <div class="insp-coord-row cols-2"><span class="insp-coord-lbl">s / h</span><input type="number" step="0.5" min="0" x-model.number="el.s" class="insp-text-input insp-input-center" placeholder="Seite"><input type="number" step="0.5" min="0" x-model.number="el.h" class="insp-text-input insp-input-center" placeholder="Höhe"></div>
                                            <div class="insp-coord-row cols-1"><span class="insp-coord-lbl">Füllung</span><input type="number" step="0.1" min="0" max="1" x-model.number="el.fillOpacity" class="insp-text-input insp-input-center"></div>
                                            <label class="insp-check-row"><input type="checkbox" x-model="el.showVertices"><span>Eckpunkte zeigen</span></label>
                                        </div>
                                    </template>

                                    <template x-if="el.type === 'polyhedron3d'">
                                        <div>
                                            <template x-for="(v, vIdx) in el.vertices" :key="vIdx">
                                                <div class="insp-coord-row has-del">
                                                    <span class="insp-coord-lbl" x-text="'P' + vIdx"></span>
                                                    <input type="number" step="0.5" x-model.number="v.x" class="insp-text-input insp-input-center" placeholder="x">
                                                    <input type="number" step="0.5" x-model.number="v.y" class="insp-text-input insp-input-center" placeholder="y">
                                                    <input type="number" step="0.5" x-model.number="v.z" class="insp-text-input insp-input-center" placeholder="z">
                                                    <button type="button" class="insp-pt-btn insp-pt-del" :disabled="el.vertices.length <= 4" @click="removeGeometryVertexInline(el, vIdx, 4)" title="Punkt entfernen">✕</button>
                                                </div>
                                            </template>
                                            <button type="button" class="insp-mini-action-btn" @click="addGeometryVertexInline(el, true)">＋ Punkt</button>
                                            <div class="insp-field margin-top-xs">
                                                <label>Flächen (Punkt-Indizes)</label>
                                                <input type="text" x-model="el.faces" class="insp-text-input insp-input-mono" placeholder="0,1,2;0,1,3;…">
                                            </div>
                                            <div class="insp-coord-row cols-1"><span class="insp-coord-lbl">Füllung</span><input type="number" step="0.1" min="0" max="1" x-model.number="el.fillOpacity" class="insp-text-input insp-input-center"></div>
                                            <label class="insp-check-row"><input type="checkbox" x-model="el.showVertices"><span>Eckpunkte zeigen</span></label>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 3. ANSICHT -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Ansicht &amp; Raum</span>
                        </div>
                        <div class="insp-field">
                            <label>Kamera-Vorlage</label>
                            <select @change="applyGeometry3dViewPreset(d, $event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">
                                <option value="" selected disabled>✨ Ansicht wählen…</option>
                                <option value="standard">Schrägbild (Standard)</option>
                                <option value="oben">Von oben</option>
                                <option value="frontal">Frontal</option>
                                <option value="seitlich">Seitlich</option>
                            </select>
                        </div>
                        <div class="insp-field">
                            <label x-text="'Drehung (Azimut): ' + Number(d.settings.az).toFixed(2)"></label>
                            <input type="range" min="-3.14" max="3.14" step="0.05" x-model.number="d.settings.az" @input="autoSave()" class="insp-range">
                        </div>
                        <div class="insp-field">
                            <label x-text="'Neigung (Elevation): ' + Number(d.settings.el).toFixed(2)"></label>
                            <input type="range" min="-1.5" max="1.5" step="0.05" x-model.number="d.settings.el" @input="autoSave()" class="insp-range">
                        </div>
                        <div class="insp-2col-grid">
                            <div class="insp-field"><label>Raum von</label><input type="number" step="1" x-model.number="d.settings.boxSize[0]" @input="autoSave()" class="insp-text-input insp-input-center"></div>
                            <div class="insp-field"><label>Raum bis</label><input type="number" step="1" x-model.number="d.settings.boxSize[1]" @input="autoSave()" class="insp-text-input insp-input-center"></div>
                        </div>
                    </div>

                    <!-- 4. DRUCKGRÖSSE -->
                    <div class="insp-section insp-section-layout">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckgröße (A4)</span>
                            <div class="insp-seg-compact insp-seg-layout">
                                <button type="button" :class="{ 'active': d.settings.width == 7 && d.settings.height == 6 }" @click="setKurveSizePreset(d, 'S')" title="Kompakt (7×6 cm)">S</button>
                                <button type="button" :class="{ 'active': d.settings.width == 10 && d.settings.height == 8 }" @click="setKurveSizePreset(d, 'M')" title="Mittel (10×8 cm)">M</button>
                                <button type="button" :class="{ 'active': d.settings.width == 14 && d.settings.height == 10 }" @click="setKurveSizePreset(d, 'L')" title="Groß (14×10 cm)">L</button>
                            </div>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Breite (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', -0.5)">−</button>
                                <input type="number" step="0.5" min="5" max="17" x-model.number="d.settings.width" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'width', 0.5)">+</button>
                            </div>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Höhe (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'height', -0.5)">−</button>
                                <input type="number" step="0.5" min="3" max="15" x-model.number="d.settings.height" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustKurveDimension(d, 'height', 0.5)">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- 5. ERWEITERT -->
                    <details class="insp-advanced">
                        <summary>Erweitert: JSXGraph-Code (3D)</summary>
                        <textarea x-model="d.code" @input="autoSave()" class="insp-code-area" placeholder="Zusätzlicher Code (board, view und JXG sind verfügbar)…"></textarea>
                    </details>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- P) BAUMDIAGRAMM (baum)                                    -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'baum'">
                <div class="inspector-body" x-data="moduleStudioInline" x-effect="workingModule = getSelectedModule()" @input="autoSave()" @change="autoSave(); calculatePagination()" @click="if ($event.target.closest('button')) { autoSave(); calculatePagination(); }">
                    <!-- 1. STRUKTUR -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Struktur</span>
                        </div>
                        <div class="insp-field">
                            <label>Stufen</label>
                            <div class="insp-seg-bar">
                                <button type="button" :class="{ 'active': d.depth == 1 }" @click="d.depth = 1; applyTreeStructure()">1</button>
                                <button type="button" :class="{ 'active': d.depth == 2 }" @click="d.depth = 2; applyTreeStructure()">2</button>
                                <button type="button" :class="{ 'active': d.depth == 3 }" @click="d.depth = 3; applyTreeStructure()">3</button>
                            </div>
                        </div>
                        <div class="insp-field">
                            <label>Äste pro Knoten</label>
                            <div class="insp-seg-bar">
                                <button type="button" :class="{ 'active': d.branches == 2 }" @click="d.branches = 2; applyTreeStructure()">2</button>
                                <button type="button" :class="{ 'active': d.branches == 3 }" @click="d.branches = 3; applyTreeStructure()">3</button>
                            </div>
                        </div>
                        <span class="insp-field-hint">Hinweis: Eine Änderung der Struktur setzt alle Beschriftungen zurück.</span>
                        <div class="insp-chip-grid margin-top-xs">
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.colorNodes }" @click="d.colorNodes = !d.colorNodes">Farben</button>
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showPathProbabilities }" @click="d.showPathProbabilities = !d.showPathProbabilities; if (!d.showPathProbabilities &amp;&amp; activeTreeLevel === 'paths') activeTreeLevel = 1">Pfad-Ergebnisse</button>
                        </div>
                    </div>

                    <!-- 2. BESCHRIFTUNG -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Beschriftung</span>
                        </div>
                        <div class="insp-seg-bar insp-seg-space">
                            <template x-for="lvl in getLevels()" :key="lvl">
                                <button type="button" :class="{ 'active': activeTreeLevel === lvl }" @click="activeTreeLevel = lvl" x-text="lvl + '. Stufe'"></button>
                            </template>
                            <button type="button" x-show="d.showPathProbabilities" :class="{ 'active': activeTreeLevel === 'paths' }" @click="activeTreeLevel = 'paths'">Pfade</button>
                        </div>

                        <!-- Äste / Knoten einer Stufe -->
                        <template x-if="activeTreeLevel !== 'paths'">
                            <div class="insp-el-list">
                                <button type="button" class="insp-mini-action-btn" x-show="activeTreeLevel > 1" @click="applyLevelDefaults(activeTreeLevel)" title="Überträgt die Werte der 1. Verzweigung auf alle weiteren Verzweigungen dieser Stufe">⚡ Werte der 1. Verzweigung übertragen</button>
                                <template x-for="node in getNodesForLevel(activeTreeLevel)" :key="node.id">
                                    <div class="insp-el-card">
                                        <div class="insp-el-head">
                                            <span class="insp-el-title" x-html="getNodeDescription(node)"></span>
                                        </div>
                                        <div class="insp-tree-row">
                                            <label>Wahrsch.</label>
                                            <input type="text" x-model="node.prob" class="insp-text-input insp-input-center" :class="{ 'insp-dimmed': node.isProbPlaceholder }" placeholder="z.B. 3/5">
                                            <button type="button" class="insp-pt-btn" :class="{ 'is-on': node.isProbPlaceholder }" @click="node.isProbPlaceholder = !node.isProbPlaceholder" title="Als Lücke für Schüler drucken">▭</button>
                                        </div>
                                        <div class="insp-tree-row">
                                            <label>Ereignis</label>
                                            <input type="text" x-model="node.label" class="insp-text-input insp-input-center" :class="{ 'insp-dimmed': node.isLabelPlaceholder }" placeholder="z.B. A">
                                            <div class="insp-pt-actions">
                                                <button type="button" class="insp-pt-btn" :class="{ 'is-on': node.isNegated }" @click="node.isNegated = !node.isNegated" title="Gegenereignis (Überstrich)"><span style="text-decoration: overline;">A</span></button>
                                                <button type="button" class="insp-pt-btn" :class="{ 'is-on': node.isLabelPlaceholder }" @click="node.isLabelPlaceholder = !node.isLabelPlaceholder" title="Als Lücke für Schüler drucken">▭</button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Pfadwahrscheinlichkeiten -->
                        <template x-if="activeTreeLevel === 'paths'">
                            <div class="insp-el-list">
                                <button type="button" class="insp-mini-action-btn" @click="calculatePathProbabilities()" title="Multipliziert die Wahrscheinlichkeiten entlang der Pfade">🪄 Alle Pfade berechnen</button>
                                <template x-for="leaf in getLeafNodes()" :key="leaf.id">
                                    <div class="insp-el-card">
                                        <div class="insp-el-head">
                                            <span class="insp-el-title" x-html="getPathSequenceHtml(leaf)"></span>
                                        </div>
                                        <div class="insp-tree-row">
                                            <label>P(Pfad)</label>
                                            <input type="text" x-model="leaf.pathProb" class="insp-text-input insp-input-center" :class="{ 'insp-dimmed': leaf.isPathProbPlaceholder }" placeholder="z.B. 3/10">
                                            <div class="insp-pt-actions">
                                                <button type="button" class="insp-pt-btn" @click="calcSinglePath(leaf.id)" title="Aus den Ästen berechnen">🪄</button>
                                                <button type="button" class="insp-pt-btn" :class="{ 'is-on': leaf.isPathProbPlaceholder }" @click="leaf.isPathProbPlaceholder = !leaf.isPathProbPlaceholder" title="Als Lücke für Schüler drucken">▭</button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- 3. DRUCKGRÖSSE -->
                    <div class="insp-section insp-section-layout">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckhöhe (A4)</span>
                            <div class="insp-seg-compact insp-seg-layout">
                                <button type="button" :class="{ 'active': d.height == 5 }" @click="d.height = 5" title="Kompakt (5 cm)">S</button>
                                <button type="button" :class="{ 'active': d.height == 7 }" @click="d.height = 7" title="Standard (7 cm)">M</button>
                                <button type="button" :class="{ 'active': d.height == 10 }" @click="d.height = 10" title="Groß (10 cm)">L</button>
                                <button type="button" :class="{ 'active': d.height == 13 }" @click="d.height = 13" title="Sehr groß (13 cm)">XL</button>
                            </div>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Höhe (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'height', -0.5, 2, 25)">−</button>
                                <input type="number" step="0.5" min="2" max="25" x-model.number="d.height" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'height', 0.5, 2, 25)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- Q) 4-FELDER-TAFEL (vierfeldertafel)                       -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'vierfeldertafel'">
                <div class="inspector-body" @input="autoSave()" @change="autoSave()">
                    <!-- 1. EREIGNISSE -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Ereignisse</span>
                        </div>
                        <div class="insp-2col-grid">
                            <div class="insp-field">
                                <label>Spalten (z.B. A)</label>
                                <input type="text" x-model="d.rawLabels.top1" @input="setVfEventPair(d, 'top')" class="insp-text-input insp-input-center" placeholder="A">
                            </div>
                            <div class="insp-field">
                                <label>Zeilen (z.B. B)</label>
                                <input type="text" x-model="d.rawLabels.left1" @input="setVfEventPair(d, 'left')" class="insp-text-input insp-input-center" placeholder="B">
                            </div>
                        </div>
                        <span class="insp-field-hint">Die Gegenereignisse (mit Überstrich) werden automatisch gesetzt.</span>
                        <details class="insp-advanced insp-advanced-inline">
                            <summary>Alle vier Beschriftungen einzeln</summary>
                            <template x-for="key in ['top1', 'top2', 'left1', 'left2']" :key="key">
                                <div class="insp-tree-row">
                                    <label x-text="({ top1: 'Spalte 1', top2: 'Spalte 2', left1: 'Zeile 1', left2: 'Zeile 2' })[key]"></label>
                                    <input type="text" x-model="d.rawLabels[key]" @input="onVierfelderLabelChange(d, key)" class="insp-text-input insp-input-center">
                                    <button type="button" class="insp-pt-btn" :class="{ 'is-on': d.negated[key] }" @click="d.negated[key] = !d.negated[key]; onVierfelderLabelChange(d, key)" title="Überstrich (Gegenereignis)"><span style="text-decoration: overline;">A</span></button>
                                </div>
                            </template>
                        </details>
                    </div>

                    <!-- 2. WERTE & SICHTBARKEIT -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Werte &amp; Druck-Sichtbarkeit</span>
                        </div>
                        <div class="insp-vf-grid">
                            <div class="insp-vf-row insp-vf-head">
                                <span></span>
                                <span x-html="renderMathInline(d.labels.top1)"></span>
                                <span x-html="renderMathInline(d.labels.top2)"></span>
                                <span>Σ</span>
                            </div>
                            <template x-for="r in [0, 1, 2]" :key="r">
                                <div class="insp-vf-row">
                                    <span class="insp-vf-rowlabel" x-html="r === 0 ? renderMathInline(d.labels.left1) : (r === 1 ? renderMathInline(d.labels.left2) : 'Σ')"></span>
                                    <template x-for="c in [0, 1, 2]" :key="c">
                                        <div class="insp-vf-cell" :class="{ 'is-hidden': !d.printVisibility[r][c] }">
                                            <input type="text" x-model="d.data[r][c]" class="insp-vf-input" placeholder="–">
                                            <button type="button" class="insp-vf-eye" @click="d.printVisibility[r][c] = !d.printVisibility[r][c]" :title="d.printVisibility[r][c] ? 'Im Druck sichtbar – klicken für Lücke' : 'Im Druck als Lücke – klicken für sichtbar'" x-text="d.printVisibility[r][c] ? '👁' : '▭'"></button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <span class="insp-field-hint">👁 = Wert wird gedruckt · ▭ = leere Lücke für Schüler</span>
                    </div>

                    <!-- 3. AKTIONEN -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Hilfen</span>
                        </div>
                        <div class="insp-add-grid">
                            <button type="button" class="insp-add-btn" @click="autofillVierfeldertafel(d); autoSave()" title="Fehlende Werte aus Summen berechnen">🪄 Automatisch ergänzen</button>
                            <button type="button" class="insp-add-btn" @click="generateVfPuzzle(d)" title="Nur einige Felder bleiben sichtbar – der Rest wird zum Rätsel">🧩 Rätsel erzeugen</button>
                            <button type="button" class="insp-add-btn" @click="setAllVfVisibility(d, true)">👁 Alle sichtbar</button>
                            <button type="button" class="insp-add-btn" @click="setAllVfVisibility(d, false)">▭ Alle als Lücke</button>
                        </div>
                    </div>
                </div>
                </template>
                <!-- ========================================================= -->
                <!-- R) URNE (urne)                                            -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'urne'">
                <div class="inspector-body" x-data="moduleStudioInline" x-effect="workingModule = getSelectedModule()" @input="autoSave()" @change="autoSave(); calculatePagination()" @click="if ($event.target.closest('button')) { autoSave(); calculatePagination(); }">
                    <!-- 1. VORLAGE -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Inhalt der Urne</span>
                        </div>
                        <div class="insp-field">
                            <label>Schnell-Vorlage</label>
                            <select @change="applyUrnePreset($event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">
                                <option value="" selected disabled>✨ Vorlage wählen…</option>
                                <option value="two_colors">4 rote &amp; 6 blaue Kugeln</option>
                                <option value="rgb">3 rote, 3 grüne, 3 blaue</option>
                                <option value="ampel">4 rote, 2 gelbe, 4 grüne</option>
                                <option value="mono">4 weiße, 4 graue, 4 schwarze</option>
                                <option value="numbered">Nummeriert 1 bis 10</option>
                                <option value="clear">Urne leeren</option>
                            </select>
                        </div>
                        <span class="insp-status-line" x-text="getUrneStudioStatusText()"></span>
                    </div>

                    <!-- 2. KUGELN HINZUFÜGEN -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Kugeln hinzufügen</span>
                        </div>
                        <div class="insp-ball-add">
                            <input type="number" min="1" max="30" x-model.number="quickKugelCount" class="insp-text-input insp-input-center" title="Anzahl">
                            <select x-model="quickKugelColor" class="insp-select">
                                <option value="white">Weiß</option>
                                <option value="grey">Grau</option>
                                <option value="black">Schwarz</option>
                                <option value="red">Rot</option>
                                <option value="yellow">Gelb</option>
                                <option value="green">Grün</option>
                                <option value="blue">Blau</option>
                            </select>
                            <input type="text" x-model="quickKugelLabel" class="insp-text-input insp-input-center" placeholder="Beschriftung" title="Optionale Beschriftung">
                            <button type="button" class="insp-mini-action-btn" @click="addQuickKugeln()">＋</button>
                        </div>

                        <div class="insp-ball-grid">
                            <template x-for="k in d.kugeln" :key="k.id">
                                <span class="insp-ball" :class="'ball-' + (k.type || 'white')">

                                    <option value="striped">Schraffiert</option>
                                    <option value="red">Rot</option>
                                    <option value="yellow">Gelb</option>
                                    <option value="green">Grün</option>

                            <div class="insp-field"><label>y-Schrittweite</label><input type="number" step="any" min="0.1" x-model.number="d.yStep" class="insp-text-input insp-input-center"></div>

                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckgröße (A4)</span>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Breite (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'width', -0.5, 3, 17)">−</button>
                                <input type="number" step="0.5" min="3" max="17" x-model.number="d.width" class="insp-step-input">

                            <select @change="applyVerteilungStudioPreset($event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">

                                <optgroup label="Binomialverteilung">

                                    <option value="norm_height">Körpergröße: μ = 175, σ = 7</option>
                                    <option value="norm_fill">Füllmenge: μ = 500, σ = 10</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- 2. PARAMETER -->

                        <div class="insp-section-header">
                            <span class="insp-section-label">Parameter</span>
                        </div>

                            <div>
                                <div class="insp-2col-grid">
                                    <div class="insp-field"><label>Versuche n</label><input type="number" min="1" max="250" step="1" :value="d.n" @change="setVerteilungN($event.target.value)" class="insp-text-input insp-input-center"></div>
                                    <div class="insp-field"><label>Wahrscheinlichkeit p</label><input type="number" min="0" max="1" step="0.01" :value="d.p" @change="setVerteilungP($event.target.value)" class="insp-text-input insp-input-center"></div>
                                </div>
                                <span class="insp-status-line" x-text="'μ = ' + (d.n * d.p).toFixed(2) + '  ·  σ = ' + Math.sqrt(d.n * d.p * (1 - d.p)).toFixed(2)"></span>

                                <div class="insp-2col-grid">
                                    <div class="insp-field"><label>Mittelwert μ</label><input type="number" step="any" :value="d.mu" @change="setVerteilungMu($event.target.value)" class="insp-text-input insp-input-center"></div>

                                </div>
                            </div>
                        </template>
                    </div>

                                            <option value="mode">Nur Erwartungswert</option>

                                    </template>
                                    <template x-if="d.type === 'normal'">
                                        <select @change="applyVerteilungIntervalPreset($event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">

                                            <option value="sigma1">μ ± 1σ (68 %)</option>
                                            <option value="sigma2">μ ± 2σ (95 %)</option>
                                            <option value="sigma3">μ ± 3σ (99,7 %)</option>
