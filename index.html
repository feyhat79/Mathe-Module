                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Wahr / Falsch Matrix</span>
                        </div>
                        <p class="insp-field-hint" style="margin-top: 0;">
                            Die zu bewertende Aussage ist der Text der Teilaufgabe selbst. Im Druck wird eine Tabelle mit den Spalten <strong>Aussage | wahr | falsch</strong> ausgegeben.
                        </p>
                    </div>

                    <!-- 2. BEGRÜNDUNGSFELD -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Begründung für Schüler</span>
                        </div>
                        <div class="insp-chip-grid">
                            <button type="button" class="insp-toggle-chip" :class="{ 'active': d.showJustification }" @click="d.showJustification = !d.showJustification">Begründungsfeld anzeigen</button>
                        </div>
                        <template x-if="d.showJustification">
                            <div class="margin-top-xs">
                                <div class="insp-field">
                                    <label>Höhe des Begründungsfelds</label>
                                    <div class="insp-seg-compact">
                                        <button type="button" :class="{ 'active': d.spaceHeight == 2 }" @click="d.spaceHeight = 2">S (2 cm)</button>
                                        <button type="button" :class="{ 'active': d.spaceHeight == 3 }" @click="d.spaceHeight = 3">M (3 cm)</button>
                                        <button type="button" :class="{ 'active': d.spaceHeight == 4.5 }" @click="d.spaceHeight = 4.5">L (4,5 cm)</button>
                                        <button type="button" :class="{ 'active': d.spaceHeight == 6 }" @click="d.spaceHeight = 6">XL (6 cm)</button>
                                    </div>
                                </div>
                                <div class="insp-kv-row">
                                    <span class="insp-kv-label">Exakte Höhe (cm)</span>
                                    <div class="insp-stepper">
                                        <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'spaceHeight', -0.5, 1, 15)">−</button>
                                        <input type="number" step="0.5" min="1" max="15" x-model.number="d.spaceHeight" class="insp-step-input">
                                        <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'spaceHeight', 0.5, 1, 15)">+</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- X) ZUORDNUNG (matching)                                   -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'matching'">
                <div class="inspector-body" @input="autoSave()" @change="autoSave(); calculatePagination()">
                    <!-- 1. VORLAGE & AKTIONEN -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Zuordnungsaufgabe</span>
                        </div>
                        <div class="insp-field">
                            <label>Schnell-Paare</label>
                            <div class="insp-seg-bar">
                                <button type="button" @click="applyMatchingPreset(d, 3)">3 Paare</button>
                                <button type="button" @click="applyMatchingPreset(d, 4)">4 Paare</button>
                                <button type="button" @click="applyMatchingPreset(d, 5)">5 Paare</button>
                            </div>
                        </div>
                        <div class="insp-inline-btns margin-top-xs">
                            <button type="button" class="insp-mini-action-btn" @click="shuffleMatchingRight(d)" title="Mischt die Reihenfolge der rechten Spalte für Schüler">🔀 Rechte Seite mischen</button>
                        </div>
                    </div>

                    <!-- 2. BEGRIFFE LINKS -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label" x-text="'Linke Begriffe (' + (d.leftItems ? d.leftItems.length : 0) + ')'"></span>
                            <button type="button" class="insp-mini-action-btn" @click="addMatchingLeftItem(d)">＋ Begriff</button>
                        </div>
                        <div class="insp-el-list">
                            <template x-for="(item, idx) in d.leftItems" :key="item.id">
                                <div class="insp-match-item-row">
                                    <span class="insp-match-badge" x-text="(idx + 1) + '.'"></span>
                                    <input type="text" x-model="item.text" class="insp-text-input" placeholder="Begriff oder Formel…">
                                    <button type="button" class="insp-pt-btn insp-pt-del" :disabled="d.leftItems.length <= 1" @click="removeMatchingLeftItem(d, item.id)" title="Entfernen">✕</button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 3. BEGRIFFE RECHTS -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label" x-text="'Rechte Begriffe (' + (d.rightItems ? d.rightItems.length : 0) + ')'"></span>
                            <button type="button" class="insp-mini-action-btn" @click="addMatchingRightItem(d)">＋ Begriff</button>
                        </div>
                        <div class="insp-el-list">
                            <template x-for="(item, idx) in d.rightItems" :key="item.id">
                                <div class="insp-match-item-row">
                                    <span class="insp-match-badge" x-text="String.fromCharCode(65 + idx) + '.'"></span>
                                    <input type="text" x-model="item.text" class="insp-text-input" placeholder="Zuordnung / Bedeutung…">
                                    <button type="button" class="insp-pt-btn insp-pt-del" :disabled="d.rightItems.length <= 1" @click="removeMatchingRightItem(d, item.id)" title="Entfernen">✕</button>
                                </div>
                            </template>
                        </div>
                        <span class="insp-field-hint">Im Druck erscheinen beide Spalten in Ellipsen zum manuellen Verbinden mit Pfeilen oder Linien. KaTeX ($...$) wird unterstützt.</span>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- Y) BILD / BILDER-RASTER (image)                           -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'image'">
                <div class="inspector-body" @input="autoSave()" @change="autoSave(); calculatePagination()">
                    <!-- 1. RASTER-LAYOUT -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Raster-Layout</span>
                        </div>
                        <div class="insp-field">
                            <label>Raster (Zeilen × Spalten)</label>
                            <div class="insp-seg-compact">
                                <button type="button" :class="{ 'active': d.rows == 1 && d.cols == 1 }" @click="setImageGrid(d, 1, 1)">1×1</button>
                                <button type="button" :class="{ 'active': d.rows == 1 && d.cols == 2 }" @click="setImageGrid(d, 1, 2)">1×2</button>
                                <button type="button" :class="{ 'active': d.rows == 2 && d.cols == 1 }" @click="setImageGrid(d, 2, 1)">2×1</button>
                                <button type="button" :class="{ 'active': d.rows == 2 && d.cols == 2 }" @click="setImageGrid(d, 2, 2)">2×2</button>
                                <button type="button" :class="{ 'active': d.rows == 1 && d.cols == 3 }" @click="setImageGrid(d, 1, 3)">1×3</button>
                            </div>
                        </div>
                    </div>

                    <!-- 2. BILD-SLOTS & UPLOAD -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label" x-text="'Bilder (' + d.slots.filter(s => !!s).length + '/' + d.slots.length + ')'"></span>
                        </div>
                        <div class="insp-image-slots-grid" :style="`grid-template-columns: repeat(${d.cols || 1}, 1fr);`">
                            <template x-for="(slot, sIdx) in d.slots" :key="sIdx">
                                <div class="insp-image-slot-card" :class="{ 'is-active-slot': d.activeIndex === sIdx }" @click="d.activeIndex = sIdx">
                                    <span class="insp-image-slot-badge" x-text="'Slot ' + (sIdx + 1)"></span>
                                    <template x-if="slot">
                                        <div class="insp-image-thumb-wrap">
                                            <img :src="slot" class="insp-image-thumb">
                                            <button type="button" class="insp-image-del-btn" @click.stop="clearImageSlot(d, sIdx); autoSave(); calculatePagination()" title="Bild entfernen">✕</button>
                                        </div>
                                    </template>
                                    <template x-if="!slot">
                                        <div class="insp-image-empty-slot">
                                            <span class="insp-empty-icon">📷</span>
                                            <span class="insp-empty-lbl">Leer</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <div class="margin-top-xs">
                            <label class="insp-file-upload-btn">
                                <span>📁 Bild für Slot <strong x-text="(d.activeIndex || 0) + 1"></strong> auswählen</span>
                                <input type="file" accept="image/*" @change="handleImageUpload(d, $event); autoSave(); calculatePagination()" style="display: none;">
                            </label>
                            <span class="insp-field-hint">💡 <strong>Tipp:</strong> Klicke auf einen Slot und drücke <strong>Strg+V</strong>, um Screenshots direkt aus der Zwischenablage einzufügen.</span>
                        </div>
                    </div>

                    <!-- 3. DRUCKGRÖSSE -->
                    <div class="insp-section insp-section-layout">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckgröße (A4)</span>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Breite (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'width', -0.5, 2, 18)">−</button>
                                <input type="number" step="0.5" min="2" max="18" x-model.number="d.width" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'width', 0.5, 2, 18)">+</button>
                            </div>
                        </div>
                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Max. Höhe (cm)</span>
                            <div class="insp-stepper">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'maxHeight', -0.5, 1, 15)">−</button>
                                <input type="number" step="0.5" min="1" max="15" x-model.number="d.maxHeight" class="insp-step-input">
                                <button type="button" class="insp-step-btn" @click="adjustDirectDimension(d, 'maxHeight', 0.5, 1, 15)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- Z) ZUSATZTEXT (zusatz)                                    -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'zusatz'">
                <div class="inspector-body" @input="autoSave()" @change="autoSave(); calculatePagination()">
                    <!-- 1. VORLAGE -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Zusatztext / Zwischenergebnis</span>
                        </div>
                        <div class="insp-field">
                            <label>Schnell-Baustein</label>
                            <select @change="applyZusatzPreset(d, $event.target.value); $event.target.value = ''" class="insp-select insp-select-preset">
                                <option value="" selected disabled>✨ Baustein wählen…</option>
                                <option value="kontrolle">[Zur Kontrolle: x = 5]</option>
                                <option value="hinweis">(Hinweis: Runde alle Zwischenergebnisse auf 2 Nachkommastellen.)</option>
                                <option value="ergebnis">[Ergebnis: A = 42 cm²]</option>
                                <option value="rechenweg">(Der Rechenweg muss nachvollziehbar dokumentiert werden.)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 2. TEXTEINGABE -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Textinhalt</span>
                        </div>
                        <textarea x-model="d.text" class="insp-code-area" style="min-height: 80px;" placeholder="z.B. [Zur Kontrolle: x = 5]"></textarea>
                        <span class="insp-field-hint">Wird im Druck kursiv unter der Teilaufgabe dargestellt. KaTeX ($...$) wird unterstützt.</span>
                    </div>

                    <!-- 3. LIVE-VORSCHAU -->
                    <template x-if="d.text">
                        <div class="insp-section insp-section-space">
                            <div class="insp-section-header">
                                <span class="insp-section-label">Vorschau</span>
                            </div>
                            <div class="insp-zusatz-preview" x-html="formatSubtaskText(d.text)"></div>
                        </div>
                    </template>
                </div>
                </template>

                <!-- ========================================================= -->
                <!-- AA) LÜCKENTEXT (lueckentext)                              -->
                <!-- ========================================================= -->
                <template x-if="mod.type === 'lueckentext'">
                <div class="inspector-body" @input="autoSave()" @change="autoSave(); calculatePagination()">
                    <!-- 1. STATUS & ERKLÄRUNG -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Lückentext-Werkzeug</span>
                        </div>
                        <p class="insp-field-hint" style="margin-top: 0;">
                            Mit Lückentexten lassen sich gezielt Begriffe im Text für Schüler ausblenden.
                        </p>
                        <button type="button" class="insp-mini-action-btn" style="width: 100%; padding: 8px;" @click="triggerInlineCloze()" title="Wandelt das aktuell auf dem Blatt markierte Wort in eine Lücke {{...}} um">
                            ✨ Markierten Text zur Lücke machen
                        </button>
                    </div>

                    <!-- 2. AKTIVE LÜCKEN -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label" x-text="'Aktive Lücken (' + getActiveClozeList().length + ')'"></span>
                        </div>
                        <template x-if="getActiveClozeList().length > 0">
                            <div class="insp-cloze-tag-list">
                                <template x-for="word in getActiveClozeList()" :key="word">
                                    <span class="insp-cloze-tag">
                                        <span x-text="word"></span>
                                        <button type="button" class="insp-cloze-del" @click="removeClozeWord(word)" title="Lücke aufheben">✕</button>
                                    </span>
                                </template>
                            </div>
                        </template>
                        <template x-if="getActiveClozeList().length === 0">
                            <span class="insp-field-hint">Noch keine Lücken im Text vorhanden. Markiere ein Wort im Aufgabentext und klicke oben auf den Button.</span>
                        </template>
                    </div>

                    <!-- 3. HINWEISE ZUM DRUCK -->
                    <div class="insp-section insp-section-space">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Druckverhalten</span>
                        </div>
                        <div class="insp-status-line">
                            📄 <strong>Schülerblatt:</strong> Die Lücken werden als leere Freiräume gedruckt.<br>
                            🔑 <strong>Musterlösung:</strong> Die Lückenwörter werden farbig hervorgehoben gedruckt.
                        </div>
                    </div>
                </div>
                </template>
            </div>
        </template>

        <!-- TASK SELECTED: STANDARD OVERVIEW -->
        <template x-if="getSelectedTask() && getSelectedTask().type !== 'section' && !(getSelectedModule() && isInlineInspectorModule(getSelectedModule().type))">
            <div class="inspector-flat-wrap">
                <!-- 1. TOP HEADER BAR -->
                <header class="inspector-top-bar">
                    <div class="inspector-top-row-main">
                        <strong class="inspector-task-heading" x-text="'Aufgabe ' + getTaskNumber(getSelectedTask().id)"></strong>
                        <span class="insp-total-pill" x-text="getTaskPoints(getSelectedTask()) + ' Pkt.'"></span>
                    </div>
                    <div class="inspector-top-row-sub">
                        <button type="button" class="insp-merken-btn" @click="saveTaskToCollection(getSelectedTask())" title="In Aufgabensammlung speichern">Merken</button>
                    </div>
                </header>

                <div class="inspector-body">
                    <!-- 2. GLIEDERUNG & PUNKTE -->
                    <div class="insp-section insp-section-outline">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Gliederung & Punkte</span>
                        </div>

                        <div class="insp-outline-list">
                            <!-- Sachkontext Row -->
                            <div class="insp-outline-row"
                                 :class="{ 'is-active': selectedArea === 'context' }"
                                 @click="selectCanvasItem(getSelectedTask(), 'context'); startInlineEdit('context-' + getSelectedTask().id, 'inline-context-' + getSelectedTask().id, getSelectedTask(), 'context')">
                                <div class="insp-outline-main">
                                    <span class="insp-outline-tag insp-tag-intro">Einleitung</span>
                                    <span class="insp-outline-text" x-text="getOutlineSnippet(getSelectedTask().context, 'Sachkontext (optional)')"></span>
                                </div>
                            </div>

                            <!-- Subtasks Rows -->
                            <template x-for="(sub, sIdx) in getSelectedTask().subtasks" :key="'out-sub-' + sub.id">
                                <div class="insp-outline-group">
                                    <div class="insp-outline-row"
                                         :class="{ 'is-active': selectedArea === 'subtask' && getSelectedSubtask()?.id === sub.id }"
                                         @click="selectCanvasItem(getSelectedTask(), 'subtask', sub)">
                                        <div class="insp-outline-main">
                                            <span class="insp-outline-tag" x-text="getSelectedTask().subtasks.length > 1 ? String.fromCharCode(97 + sIdx) + ')' : 'Aufgabe'"></span>
                                            <span class="insp-outline-text" x-text="getOutlineSnippet(sub.text, 'Text eingeben…')"></span>
                                        </div>

                                        <div class="insp-outline-right" @click.stop>
                                            <!-- Direct Points Control if no sub-subtasks -->
                                            <template x-if="!sub.subSubtasks || sub.subSubtasks.length === 0">
                                                <div class="insp-stepper" :class="{ 'has-points': (parseFloat(sub.points) || 0) > 0 }">
                                                    <button type="button" class="insp-step-btn" @click="adjustPoints(sub, -0.5)" title="-0,5 Punkte">−</button>
                                                    <input type="number" step="0.5" min="0" x-model.number="sub.points" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                                    <button type="button" class="insp-step-btn" @click="adjustPoints(sub, 0.5)" title="+0,5 Punkte">+</button>
                                                </div>
                                            </template>

                                            <!-- Sum display if sub-subtasks exist -->
                                            <template x-if="sub.subSubtasks && sub.subSubtasks.length > 0">
                                                <span class="insp-sub-sum" x-text="getSubtaskPoints(sub) + ' P.'"></span>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Indented Sub-Subtasks 1), 2)... -->
                                    <template x-if="sub.subSubtasks && sub.subSubtasks.length > 0">
                                        <div class="insp-subsub-list">
                                            <template x-for="(ss, ssIdx) in sub.subSubtasks" :key="'out-ss-' + ss.id">
                                                <div class="insp-outline-row insp-outline-subsub"
                                                     :class="{ 'is-active': selectedArea === 'subsub' && getSelectedSubSubtask()?.id === ss.id }"
                                                     @click="selectCanvasItem(getSelectedTask(), 'subsub', sub, ss)">
                                                    <div class="insp-outline-main">
                                                        <span class="insp-outline-tag insp-tag-subsub" x-text="(ssIdx + 1) + ')'"></span>
                                                        <span class="insp-outline-text" x-text="getOutlineSnippet(ss.text, 'Unteraufgabe…')"></span>
                                                    </div>
                                                    <div class="insp-outline-right" @click.stop>
                                                        <div class="insp-stepper" :class="{ 'has-points': (parseFloat(ss.points) || 0) > 0 }">
                                                            <button type="button" class="insp-step-btn" @click="adjustPoints(ss, -0.5)">−</button>
                                                            <input type="number" step="0.5" min="0" x-model.number="ss.points" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                                            <button type="button" class="insp-step-btn" @click="adjustPoints(ss, 0.5)">+</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <label class="insp-check-row">
                            <input type="checkbox"
                                   :checked="!meta.hideSubtaskPoints"
                                   @change="meta.hideSubtaskPoints = !$event.target.checked; autoSave(); calculatePagination()">
                            <span>Teilpunkte auf dem Blatt anzeigen</span>
                        </label>
                    </div>

                    <!-- 3. SCHREIBFELD (When Subtask or Sub-Subtask active) -->
                    <template x-if="getActiveSpaceTarget() && selectedArea !== 'context'">
                        <div class="insp-section insp-section-space">
                            <div class="insp-section-header">
                                <span class="insp-section-label">Schreibfeld</span>
                                <span class="insp-context-hint insp-hint-space" x-text="selectedArea === 'subsub' && getSelectedSubSubtask() ? 'Unteraufgabe ' + (getSelectedSubSubtaskIndex() + 1) + ')' : (getSelectedTask().subtasks.length > 1 ? 'Teil ' + String.fromCharCode(97 + getSelectedSubtaskIndex()) + ')' : 'Aufgabe')"></span>
                            </div>

                            <div class="insp-seg-bar insp-seg-space">
                                <button type="button"
                                        class="seg-off"
                                        :class="{ 'active': !getActiveSpaceTarget().spaceType || getActiveSpaceTarget().spaceType === 'none' }"
                                        @click="setSubtaskSpaceType(getActiveSpaceTarget(), 'none')">
                                    Aus
                                </button>
                                <button type="button"
                                        :class="{ 'active': getActiveSpaceTarget().spaceType === 'karo' }"
                                        @click="setSubtaskSpaceType(getActiveSpaceTarget(), 'karo')">
                                    Karo
                                </button>
                                <button type="button"
                                        :class="{ 'active': getActiveSpaceTarget().spaceType === 'linien' }"
                                        @click="setSubtaskSpaceType(getActiveSpaceTarget(), 'linien')">
                                    Linien
                                </button>
                                <button type="button"
                                        :class="{ 'active': getActiveSpaceTarget().spaceType === 'millimeter' }"
                                        @click="setSubtaskSpaceType(getActiveSpaceTarget(), 'millimeter')">
                                    mm
                                </button>
                            </div>

                            <template x-if="getActiveSpaceTarget().spaceType && getActiveSpaceTarget().spaceType !== 'none'">
                                <div class="insp-kv-row margin-top-xs">
                                    <span class="insp-kv-label">Höhe (cm)</span>
                                    <div class="insp-stepper insp-stepper-space">
                                        <button type="button" class="insp-step-btn" @click="adjustSpaceHeight(getActiveSpaceTarget(), -0.5)">−</button>
                                        <input type="number" step="0.5" min="1" max="24" x-model.number="getActiveSpaceTarget().spaceHeight" @input="autoSave(); calculatePagination()" class="insp-step-input">
                                        <button type="button" class="insp-step-btn" @click="adjustSpaceHeight(getActiveSpaceTarget(), 0.5)">+</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- 4. EINFÜGEN & MODULE -->
                    <div class="insp-section insp-section-modules">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Einfügen & Module</span>
                        </div>

                        <div class="insp-tool-grid">
                            <button type="button" class="insp-action-btn insp-btn-formula" @mousedown.prevent="triggerFormulaForActive()" title="Mathematische Formel einfügen">
                                <span class="insp-sym">∑</span> Formel
                            </button>
                            <button type="button" class="insp-action-btn insp-btn-module" @click="openModuleModal(getActiveModuleHolder())">
                                + Modul
                            </button>
                        </div>

                        <!-- Context-sensitive Cloze action (only appears when text is selected in a textarea) -->
                        <template x-if="hasInlineSelection">
                            <button type="button" class="insp-action-btn insp-btn-cloze insp-btn-full" @mousedown.prevent="triggerClozeForActive(); hasInlineSelection = false" title="Markiertes Wort in Lücke umwandeln (Strg+L)">
                                Markierung als Lücke umwandeln
                            </button>
                        </template>

                        <!-- Attached modules list -->
                        <template x-if="getActiveModuleHolder() && getActiveModuleHolder().modules && getActiveModuleHolder().modules.length > 0">
                            <div class="insp-mod-list">
                                <template x-for="mod in getActiveModuleHolder().modules" :key="'insp-mod-' + mod.id">
                                    <div class="insp-mod-row" @click="editModuleFromInspector(getActiveModuleHolder(), mod)" style="cursor: pointer;" title="Klicken zum Bearbeiten">
                                        <span class="insp-mod-name" x-text="getModuleDisplayName(mod.type)"></span>
                                        <div class="insp-mod-btns" @click.stop>
                                            <button type="button"
                                                    class="insp-mod-link"
                                                    @click="editModuleFromInspector(getActiveModuleHolder(), mod)">
                                                Bearbeiten
                                            </button>
                                            <button type="button"
                                                    class="insp-mod-del"
                                                    @click="removeModuleById(getActiveModuleHolder(), mod.id); autoSave(); calculatePagination()"
                                                    title="Modul entfernen">×</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- 5. LAYOUT & OPTIONEN -->
                    <div class="insp-section insp-section-layout">
                        <div class="insp-section-header">
                            <span class="insp-section-label">Layout</span>
                        </div>

                        <div class="insp-kv-row">
                            <span class="insp-kv-label">Spalten</span>
                            <div class="insp-seg-compact insp-seg-layout">
                                <button type="button" :class="{ 'active': (getSelectedTask().subtaskColumns || 1) === 1 }" @click="getSelectedTask().subtaskColumns = 1; autoSave(); calculatePagination()">1</button>
                                <button type="button" :class="{ 'active': getSelectedTask().subtaskColumns === 2 }" @click="getSelectedTask().subtaskColumns = 2; autoSave(); calculatePagination()">2</button>
                                <button type="button" :class="{ 'active': getSelectedTask().subtaskColumns === 3 }" @click="getSelectedTask().subtaskColumns = 3; autoSave(); calculatePagination()">3</button>
                            </div>
                        </div>

                        <label class="insp-check-row">
                            <input type="checkbox"
                                   :checked="!!getSelectedTask().pageBreakBefore"
                                   @change="toggleTaskPageBreak(getSelectedTask())">
                            <span>Auf neuer Seite beginnen</span>
                        </label>
                    </div>
                </div>
            </div>
        </template>
    </aside>

    <!-- Modal Overlay: Task Editor -->
    <include src="./src/templates/editor-modal.html"></include>

    <!-- Visual Math Editor Overlay (MathLive) -->
    <template x-if="isVisualEditorOpen">
        <div class="modal-overlay visual-editor-overlay" @click.self="closeVisualEditor()">
            <div class="modal-content visual-editor-content">
                <header class="modal-header">
                    <h3>Formel-Assistent</h3>
                    <button class="btn-secondary btn-close-modal" @click="closeVisualEditor()">&times;</button>
                </header>
                <div class="modal-body">
                    <p class="modal-hint-text">
                        Nutzen Sie das Feld unten für komplexe Formeln. Die virtuelle Tastatur erscheint beim Klicken.
                    </p>
                    <math-field id="main-math-field" class="main-math-editor-field"></math-field>
                </div>
                <footer class="modal-footer">
                    <button class="btn-secondary" @click="closeVisualEditor()">Abbrechen</button>
                    <button class="btn-primary btn-width-auto" @click="insertMathFromEditor()">Formel übernehmen</button>
                </footer>
            </div>
        </div>
    </template>

    <!-- Metadata Settings Modal -->
    <template x-if="isMetaModalOpen">
        <div class="modal-overlay" @click.self="closeMetaModal()">
            <div class="modal-content meta-modal-content">
                <header class="modal-header">
                    <h2 x-text="meta.docType === 'test' ? 'Test-Einstellungen bearbeiten' : 'Arbeitsblatt-Einstellungen bearbeiten'"></h2>
                    <button class="btn-secondary btn-close-modal" @click="closeMetaModal()">&times;</button>
                </header>

                <div class="modal-body">
                    <div class="input-group">
                        <label>Dokumenttyp</label>
                        <div class="doc-type-selector">
                            <button type="button" 
                                    class="doc-type-btn" 
                                    :class="meta.docType === 'worksheet' ? 'active' : ''" 
                                    @click="meta.docType = 'worksheet'; if(meta.art === 'Klassenarbeit' || !meta.art) meta.art = 'Arbeitsblatt';">
                                📝 Arbeitsblatt
                            </button>
                            <button type="button" 
                                    class="doc-type-btn" 
                                    :class="meta.docType === 'test' ? 'active' : ''" 
                                    @click="meta.docType = 'test'; if(meta.art === 'Arbeitsblatt' || !meta.art) meta.art = 'Klassenarbeit';">
                                🏆 Test / Klassenarbeit
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="meta-titel">Titel der Arbeit</label>
                        <input type="text" id="meta-titel" x-model="meta.titel" placeholder="z.B. 3. Klassenarbeit - Analysis">
                    </div>
                    <div class="grid-2-col">
                        <div class="input-group">
                            <label for="meta-art">Art des Dokuments</label>
                            <input type="text" id="meta-art" x-model="meta.art" placeholder="z.B. Klassenarbeit">
                        </div>
                        <div class="input-group">
                            <label for="meta-nr">Nummer</label>
                            <input type="text" id="meta-nr" x-model="meta.nr" placeholder="z.B. 3">
                        </div>
                    </div>
                    <div class="grid-3-col">
                        <div class="input-group">
                            <label for="meta-fach">Fach</label>
                            <input type="text" id="meta-fach" x-model="meta.fach">
                        </div>
                        <div class="input-group">
                            <label for="meta-klasse">Klasse</label>
                            <input type="text" id="meta-klasse" x-model="meta.klasse">
                        </div>
                        <div class="input-group">
                            <label for="meta-datum">Datum</label>
                            <input type="date" id="meta-datum" x-model="meta.datum">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="meta-hinweise">Hinweise (Druck)</label>
                        <textarea id="meta-hinweise" x-model="meta.hinweise" class="compact-textarea"></textarea>
                    </div>
                    <div class="input-group" style="margin-top: 12px; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md);">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-main); margin: 0;">
                            <input type="checkbox" id="meta-hide-subtask-points" x-model="meta.hideSubtaskPoints" style="width: 17px; height: 17px; cursor: pointer; accent-color: var(--accent);">
                            <span>Teilpunkte im Druck/Dokument ausblenden</span>
                        </label>
                        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; margin-left: 27px; display: block; line-height: 1.35;">
                            Blendet die einzelnen <em>(X Pkt.)</em> an den Teilaufgaben im Dokument aus. Die Gesamtpunkte der Aufgaben und der Arbeit bleiben vollständig erhalten.
                        </small>
                    </div>
                </div>

                <footer class="modal-footer">
                    <button class="btn-primary btn-width-auto" @click="closeMetaModal()">Fertig</button>
                </footer>
            </div>
        </div>
    </template>

    <!-- Module Catalog Modal -->
    <include src="./src/templates/module-catalog.html"></include>

    <!-- Module Studio Modal (Split-Screen Live Preview) -->
    <include src="./src/templates/module-studio-modal.html"></include>

    <!-- Onboarding Tour Overlay -->
    <div x-data="onboarding" 
         x-show="isActive" 
         x-cloak
         class="tour-overlay" 
         x-transition:opacity>
        
        <!-- Highlight cutout -->
        <div class="tour-cutout" :style="cutoutStyle"></div>
        
        <!-- Floating Info Card -->
        <div class="tour-card" :style="cardStyle">
            <header class="tour-card-header">
                <h3 x-text="currentStepData.title"></h3>
                <button @click="endTour()" class="tour-close-btn" title="Tour beenden">&times;</button>
            </header>
            <div class="tour-card-body">
                <p x-text="currentStepData.description"></p>
            </div>
            <footer class="tour-card-footer">
                <span class="tour-step-indicator" x-text="`${currentStep + 1} / ${steps.length}`"></span>
                <div class="tour-actions">
                    <button @click="prevStep()" :disabled="currentStep === 0" class="btn-tour-secondary">Zurück</button>
                    <button @click="nextStep()" class="btn-tour-primary" x-text="currentStep === steps.length - 1 ? 'Fertig' : 'Weiter'"></button>
                </div>
            </footer>
        </div>
    </div>

</body>
</html>
